<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121313" />
  <title>Fuiet Infinite Canvas</title>

  <!-- Historical feature styles stay available, but are quarantined below UI 2.3 in cascade priority. -->
  <link rel="stylesheet" href="./styles/legacy-layer.css" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/workspace.css" />
  <link rel="stylesheet" href="./styles/canvas.css" />
  <link rel="stylesheet" href="./styles/connections.css" />
  <link rel="stylesheet" href="./styles/nodes.css" />
  <link rel="stylesheet" href="./styles/composer.css" />
  <link rel="stylesheet" href="./styles/context-toolbar.css" />
  <link rel="stylesheet" href="./styles/result-shell.css" />
  <link rel="stylesheet" href="./styles/asset-manager.css" />
  <link rel="stylesheet" href="./styles/desktop.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap workspace-canvas-bar">
        <span class="fuiet-wordmark" aria-label="Fuiet">Fuiet</span>
        <span class="workspace-divider" aria-hidden="true"></span>
        <button id="brandButton" class="workspace-name" aria-label="工作区菜单" title="双击重命名工作区">
          <span id="workspaceName">未命名工作区</span>
        </button>
        <span class="workspace-divider" aria-hidden="true"></span>
        <button id="projectName" class="project-name canvas-switcher" title="切换画布">画布 1</button>
        <div class="canvas-view-switch" aria-label="画布视图">
          <button id="workflowViewBtn" class="canvas-view-btn active" title="工作流视图" aria-label="工作流视图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="18" r="2.3"/><path d="M8.1 7.2 10.9 15M15.9 7.2 13.1 15M8.4 6h7.2"/></svg>
          </button>
          <button id="storyboardViewBtn" class="canvas-view-btn" title="故事版视图" aria-label="故事版视图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M9 4v16M9 10h11M9 15h11"/></svg>
          </button>
        </div>
      </div>

      <div class="topbar-right" aria-label="全局操作">
        <button class="top-icon" title="撤销" id="undoBtn" aria-label="撤销"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 3 12l6-6"/><path d="M21 18a9 9 0 0 0-9-9H3"/></svg></button>
        <button class="top-icon" title="重做" id="redoBtn" aria-label="重做"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l6-6-6-6"/><path d="M3 18a9 9 0 0 1 9-9h9"/></svg></button>
        <button id="productionBtn" class="top-icon" title="运行 / 项目生产" aria-label="运行 / 项目生产"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 18 12 8 18.5v-13Z"/></svg></button>
        <button id="shareBtn" class="top-icon" title="分享" aria-label="分享"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg></button>
        <!-- Existing handlers remain available while secondary chrome is hidden by UI 2.3. -->
        <button id="contextBtn" class="top-icon context-top-btn" title="创作上下文" aria-label="创作上下文"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a3.5 3.5 0 1 0 0-5"/><path d="M14 11h4"/><path d="M12 2h5a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3h-5"/><path d="M8 22H7a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1"/></svg></button>
        <button id="taskBtn" class="top-icon" title="任务队列" aria-label="任务队列"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
        <button id="agentBtn" class="top-icon agent-btn" title="Agent" aria-label="Agent"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M7 20h10"/><path d="M8 8h.01"/><path d="M16 8h.01"/><path d="M9 12h6"/></svg><span>Agent</span></button>
        <button id="settingsBtn" class="top-icon" title="设置" aria-label="设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3"/><path d="M12 19v3"/><path d="M4.9 4.9l2.1 2.1"/><path d="M17 17l2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="M4.9 19.1 7 17"/><path d="M17 7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg></button>
      </div>
    </header>

    <section id="drawer" class="drawer hidden"></section>

    <main id="canvasViewport" class="canvas-viewport" tabindex="0">
      <div id="canvasWorld" class="canvas-world">
        <svg id="edgeLayer" class="edge-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="groupLayer" class="group-layer"></div>
        <div id="nodeLayer" class="node-layer"></div>
      </div>
      <section id="storyboardView" class="storyboard-view hidden" aria-label="故事版视图"></section>
      <div id="selectionRect" class="selection-rect hidden"></div>
      <div id="emptyCanvasHint" class="empty-canvas-hint hidden"><b>开始一个工作流</b><span>添加节点、拖入素材，或从已有结果继续创作。</span><small>双击空白处也可以快速新建节点</small></div>
      <div id="emptyQuickBar" class="empty-quick-bar hidden"></div>
    </main>

    <div id="nodeToolbar" class="node-toolbar hidden"></div>
    <div id="generatorPanel" class="generator-panel hidden"></div>
    <div id="projectMenu" class="project-menu hidden"></div>
    <div id="contextMenu" class="context-menu hidden"></div>
    <div id="providerModal" class="provider-modal hidden"></div>
    <div id="modelPicker" class="model-picker hidden"></div>
    <div id="featureModal" class="feature-modal hidden"></div>
    <div id="timelinePanel" class="timeline-panel hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="loginModal" class="login-modal hidden"></div>
    <aside id="agentPanel" class="agent-panel" aria-label="Agent 面板"></aside>

    <div class="bottom-left" aria-label="画布状态与资产">
      <button id="assetManagerBtn" class="pill-btn" type="button" aria-expanded="false" aria-controls="drawer" title="资产管理">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h6l1.6 2H20v11H4v-13Z"/><path d="M4 9h16"/></svg>
        <span>资产管理</span>
      </button>
      <button id="minimapBtn" class="pill-btn" title="小地图" aria-label="小地图"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m7 15 3-3 2 2 3-4 2 2"/></svg></button>
      <button id="zoomBtn" class="pill-btn zoom-label">100%</button>
    </div>
    <div id="minimap" class="minimap hidden"><div id="minimapNodes"></div><div id="minimapView"></div></div>

    <div id="bottomDock" class="bottom-dock" aria-label="画布快捷工具栏">
      <button class="dock-btn primary" data-dock-action="add" title="添加节点" aria-label="添加节点">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12"/><path d="M6 12h12"/></svg>
      </button>
      <button class="dock-btn" data-dock-action="mode" title="选择 / 移动" aria-label="选择 / 移动" aria-pressed="false">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 4.8 17.9 11 12.4 12.3 10.2 19 5.2 4.8Z"/></svg>
      </button>
      <button class="dock-btn" data-dock-action="connect" title="连接节点" aria-label="连接节点" aria-pressed="false">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 14.8 6.8 17a3.5 3.5 0 1 1-4.9-4.9l2.2-2.2"/><path d="M14.8 9.2 17 7a3.5 3.5 0 1 1 4.9 4.9l-2.2 2.2"/><path d="M8.5 15.5 15.5 8.5"/></svg>
      </button>
      <button class="dock-btn" data-dock-action="layout" title="自动布局" aria-label="自动布局">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="12" cy="18" r="1.7"/><path d="M7.5 7.2 10.7 15M16.5 7.2 13.3 15M8.2 6h7.6"/></svg>
      </button>
      <button class="dock-btn" data-dock-action="history" title="历史记录" aria-label="历史记录">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.2v5l3.1 1.9"/></svg>
      </button>

      <!-- Hidden compatibility actions: UI 2.3 exposes these from their dedicated surfaces. -->
      <button class="dock-btn" data-dock-action="asset" title="资产" aria-label="资产">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 8.2 11 5.3c.6-.5 1.4-.5 2 0l3.5 2.9"/><path d="M6 10.8 12 7l6 3.8"/><path d="M6.8 15.8 12 12.9l5.2 2.9"/><path d="M8.5 17.7 12 15.9l3.5 1.8"/></svg>
      </button>
      <span class="dock-separator"></span>
      <button class="dock-btn" data-dock-action="shortcuts" title="快捷键" aria-label="快捷键"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/><path d="M6 18h12"/></svg></button>
      <button class="dock-btn" data-dock-action="help" title="教程" aria-label="教程"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.1 9a3 3 0 1 1 4.8 2.4c-.8.6-1.4 1.1-1.4 2.6"/><path d="M12 18h.01"/><circle cx="12" cy="12" r="9"/></svg></button>
    </div>
    <div class="bottom-center-hint">双击空白处新建节点 · 拖动节点端口建立连接</div>
  </div>

  <script type="module" src="./three-runtime.js"></script>
  <script src="./app.js"></script>
  <script src="./security-client.js"></script>
  <script src="./ui-zh.js"></script>
  <script src="./ui-v2.js"></script>
  <script src="./ui-v23.js"></script>
  <script src="./ui-connect-v23.js"></script>
</body>
</html>
