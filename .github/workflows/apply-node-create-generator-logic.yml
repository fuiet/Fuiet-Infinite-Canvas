name: Apply node create generator logic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-node-create-generator-logic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only node-creation auto-open behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('_read_123_zip_20260821_180410/app.js')
          s=app.read_text()
          old="function runPaletteNode(type,p,fromNodeId){const created=addNode(type,p,true);if(created&&['image','video','audio','script'].includes(created.type))expandedNodeId=created.id;else if(created?.type==='text')expandedNodeId=null;if(fromNodeId&&created){const edge=createEdge(fromNodeId,created.id,{type:'asset',silent:true});if(!edge)showToast('这个节点组合无法连接')}saveState();render();return created}"
          new="function runPaletteNode(type,p,fromNodeId){const created=addNode(type,p,true);expandedNodeId=null;if(fromNodeId&&created){const edge=createEdge(fromNodeId,created.id,{type:'asset',silent:true});if(!edge)showToast('这个节点组合无法连接')}saveState();render();return created}"
          if old not in s:
              raise SystemExit('Expected runPaletteNode source not found; refusing broad edit')
          s=s.replace(old,new,1)
          app.write_text(s)

          index=Path('_read_123_zip_20260821_180410/index.html')
          h=index.read_text()
          old_src='./app.js?v=20260827-textedit-1'
          new_src='./app.js?v=20260827-nodecreate-1'
          if old_src not in h:
              raise SystemExit('Expected app.js cache tag not found')
          index.write_text(h.replace(old_src,new_src,1))
          PY
      - name: Syntax and regression guards
        run: |
          node --check _read_123_zip_20260821_180410/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_read_123_zip_20260821_180410/app.js').read_text()
          assert "function runPaletteNode(type,p,fromNodeId){const created=addNode(type,p,true);expandedNodeId=null;" in s
          assert "expandedNodeId=clicked&&uiV23NodeContentState(clicked)==='empty'?finished.id:null" in s
          assert "function finishConnectionPointerUp(e)" in s
          assert "function beginManualTextEdit(n)" in s
          print('regression guards passed')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Do not auto-open generator for new nodes'
          git push origin main
