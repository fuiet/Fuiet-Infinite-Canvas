name: Patch selected Shot first-frame sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-shot-first-frame-sync.py'
      - '.github/workflows/patch-shot-first-frame-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-shot-first-frame-sync.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/tests/script-first-frame-sync.test.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Keep selected Shot first frame in sync'
            git push origin main
          fi
