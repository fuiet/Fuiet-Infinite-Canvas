name: Patch XOGPU create 404 fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xogpu-create-404-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-xogpu-create-fallback.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Focused XOGPU tests
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/xogpu-minimax-h3.test.mjs tests/xogpu-create-path-fallback.test.mjs tests/video-protocol-registry.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git rm .github/workflows/patch-xogpu-create-404-fallback.yml scripts/patch-xogpu-create-fallback.py
          git add _read_123_zip_20260821_180410/video-protocol-registry.js
          git add _read_123_zip_20260821_180410/browser-runtime-preview.js
          git add _read_123_zip_20260821_180410/browser-runtime.js
          git add _read_123_zip_20260821_180410/server.js
          git add _read_123_zip_20260821_180410/index.html
          git add _read_123_zip_20260821_180410/tests/xogpu-create-path-fallback.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Fallback XOGPU video create path on 404'
          git push origin main
