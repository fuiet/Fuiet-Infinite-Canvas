name: Patch text result card scroll

on:
  push:
    paths:
      - 'scripts/patch-text-result-card-scroll.py'
      - '.github/workflows/patch-text-result-card-scroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: python scripts/patch-text-result-card-scroll.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/styles/text-node.css _read_123_zip_20260821_180410/index.html _read_123_zip_20260821_180410/tests/text-result-card-scroll.test.mjs
          git commit -m "Fix text result card layout and scrolling"
          git push
