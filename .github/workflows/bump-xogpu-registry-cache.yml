name: Bump XOGPU registry cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bump-xogpu-registry-cache.py'
      - '.github/workflows/bump-xogpu-registry-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache bump
        run: python scripts/bump-xogpu-registry-cache.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: XOGPU focused test
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/xogpu-minimax-h3.test.mjs
      - name: Commit cache bump
        run: |
          rm -f scripts/bump-xogpu-registry-cache.py .github/workflows/bump-xogpu-registry-cache.yml
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh XOGPU protocol cache after rollback'
          git push
