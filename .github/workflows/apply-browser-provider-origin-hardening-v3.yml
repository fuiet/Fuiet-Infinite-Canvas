name: Apply Browser Provider Origin Hardening V3

on:
  push:
    branches:
      - browser-provider-origin-hardening-v3
    paths:
      - '.github/workflows/apply-browser-provider-origin-hardening-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-provider-origin-hardening-v3
          fetch-depth: 0

      - name: Apply provider origin hardening
        run: python scripts/patch-browser-provider-origin-v3.py

      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-browser-provider-origin-v3.py
          rm .github/workflows/apply-browser-provider-origin-hardening-v3.yml

      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden browser provider credential origin boundary"
          git push origin HEAD:browser-provider-origin-hardening-v3
