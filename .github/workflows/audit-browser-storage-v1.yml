name: Audit Browser Storage V1

on:
  push:
    branches:
      - feature/browser-storage-manager
    paths:
      - '.github/workflows/audit-browser-storage-v1.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan direct browser storage access
        run: |
          echo '=== localStorage/sessionStorage usage ==='
          grep -RInE 'localStorage|sessionStorage' _read_123_zip_20260821_180410 \
            --include='*.js' --include='*.html' \
            --exclude='browser-runtime.js' --exclude='browser-media-sw.js' \
            --exclude-dir='.frontend-design' || true
          echo '=== Storage keys string candidates ==='
          grep -RInE "(canvas|fuiet|model|provider|project|clipboard|recent|dock|grid|snap|mini|zoom|theme|setting)[A-Za-z0-9_.:-]*" _read_123_zip_20260821_180410 \
            --include='*.js' --exclude='browser-runtime.js' --exclude='browser-media-sw.js' \
            --exclude-dir='.frontend-design' | grep -E 'localStorage|sessionStorage' || true
