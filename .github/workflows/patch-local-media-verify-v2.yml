name: Patch Local Media Verify V2

on:
  push:
    branches: [local-desktop-hardening-v2]
    paths:
      - 'scripts/patch-local-media-verify-v2.py'
      - '.github/workflows/patch-local-media-verify-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-desktop-hardening-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply precise media verification patch
        run: python scripts/patch-local-media-verify-v2.py
      - name: Syntax check patched runtime
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Commit patched server
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/server.js
          if git diff --cached --quiet; then
            echo 'No server changes to commit.'
            exit 0
          fi
          git commit -m 'Verify local media outputs before success'
          git push origin HEAD:local-desktop-hardening-v2
