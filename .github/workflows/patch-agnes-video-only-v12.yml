# rerun after Agnes-only regression update
name: Patch Agnes video only v12

on:
  push:
    branches: [agnes-video-only-v12]
    paths:
      - '.github/workflows/patch-agnes-video-only-v12.yml'
      - '_read_123_zip_20260821_180410/scripts/patch-agnes-video-only-v12.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agnes-video-only-v12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Agnes-only video changes
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/patch-agnes-video-only-v12.cjs
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Agnes video contract tests
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/agnes-fixed-adapter.test.mjs tests/video-protocol-registry.test.mjs tests/video-result-cache-bust.test.mjs tests/video-error-reporting.test.mjs
      - name: Full test suite
        working-directory: _read_123_zip_20260821_180410
        run: timeout 120s npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make video generation Agnes-only"
          git push origin HEAD:agnes-video-only-v12
