name: Patch Agnes fixed adapter v9

on:
  push:
    branches: [agnes-fixed-adapter-v9]
    paths:
      - '.github/workflows/patch-agnes-fixed-adapter-v9.yml'
      - '_read_123_zip_20260821_180410/scripts/patch-agnes-fixed-adapter-v9.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agnes-fixed-adapter-v9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Agnes adapter patch
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/patch-agnes-fixed-adapter-v9.cjs
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Agnes regression tests
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/agnes-fixed-adapter.test.mjs
      - name: Full test suite
        working-directory: _read_123_zip_20260821_180410
        run: timeout 90s npm test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add fixed Agnes text image video adapters"
          git push origin HEAD:agnes-fixed-adapter-v9
