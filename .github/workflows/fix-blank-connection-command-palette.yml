name: Fix Blank Connection Command Palette

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blank-connection-command-palette.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Route blank connection drops to command palette
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_read_123_zip_20260821_180410/app.js')
          s = path.read_text(encoding='utf-8')

          old = """    cleanupConnectionDrag(true);\n    if(shouldQuickAdd){\n      window.__quickAddOpenedAt=Date.now();\n      requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from));\n    }\n    return true;\n"""
          new = """    // The connection gesture is already fully cleaned in-place here. Avoid a full\n    // canvas render before opening the continuation palette: rebuilding every node in\n    // the pointerup path can invalidate the just-finished gesture and make blank drops\n    // appear to lock the canvas.\n    cleanupConnectionDrag(false);\n    if(shouldQuickAdd){\n      window.__quickAddOpenedAt=Date.now();\n      requestAnimationFrame(()=>showCommandPalette(clientX,clientY,dropPoint,{fromNodeId:from}));\n    }\n    return true;\n"""

          if old not in s:
              raise SystemExit('blank connection release block not found')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: node --check _read_123_zip_20260821_180410/app.js

      - name: Verify blank-drop invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('_read_123_zip_20260821_180410/app.js').read_text(encoding='utf-8')
          assert 'cleanupConnectionDrag(false);' in s
          assert 'showCommandPalette(clientX,clientY,dropPoint,{fromNodeId:from})' in s
          assert 'requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from))' not in s
          assert "function showCommandPalette(x,y,p,{fromNodeId=null,initialQuery=''" in s
          PY
          git diff --check

      - name: Commit production fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/app.js
          git commit -m "Fix blank connection drop palette freeze"
          git push origin main
