name: Apply Browser Local Runtime V1

on:
  push:
    branches: [feature/browser-local-runtime]
    paths: ['.github/workflows/apply-browser-local-runtime-v1.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Convert Cloudflare preview to stateless transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          root=Path('_read_123_zip_20260821_180410')

          def inject_runtime(path):
              text=path.read_text(encoding='utf-8')
              anchor='<script src="./provider-adapter-contract.js?v=20260827-autoconfig-2"></script>'
              inject=anchor+'\n  <script src="./provider-runtime-core.js?v=20260828-browser-runtime-1"></script>\n  <script src="./browser-runtime.js?v=20260828-browser-runtime-1"></script>'
              if 'browser-runtime.js' not in text:
                  if anchor not in text:
                      raise SystemExit(f'provider adapter script anchor missing in {path}')
                  text=text.replace(anchor,inject,1)
              path.write_text(text,encoding='utf-8')

          inject_runtime(root/'index.html')
          inject_runtime(root/'models.html')

          # Cloudflare must not contain an application database/runtime anymore.
          shutil.rmtree(root/'dist'/'server',ignore_errors=True)
          shutil.rmtree(root/'supabase',ignore_errors=True)
          shutil.rmtree(root/'functions'/'media',ignore_errors=True)

          # Remove tests tied to the retired stateful Cloudflare Worker implementation.
          for test in (root/'tests').glob('*.test.mjs'):
              text=test.read_text(encoding='utf-8',errors='ignore')
              if any(marker in text for marker in [
                  "dist/server/", "pages-entry.js", "secure-entry.js", "production-entry.js",
                  "SUPABASE_SERVICE_ROLE_KEY", "CANVAS_ENFORCE_OWNER", "owner-resolver.js"
              ]):
                  test.unlink()

          (root/'wrangler.toml').write_text('''name = "fuiet-infinite-canvas"\ncompatibility_date = "2026-08-28"\npages_build_output_dir = "."\n\n[vars]\nCANVAS_PREVIEW_MODE = "stateless-browser"\n\n# Cloudflare is intentionally preview transport only.\n# Do not bind D1, KV, R2, Durable Objects, Supabase credentials, provider secrets,\n# project storage or task storage to this Pages project. Browser preview data stays\n# in the visitor browser. /api/proxy only forwards an individual upstream request.\n''',encoding='utf-8')

          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          pkg['name']='fuiet-infinite-canvas-preview'
          pkg['version']='4.5.0'
          pkg['description']='Fuiet Infinite Canvas 在线开发预览版：浏览器本地数据 + 平台无关 Provider Core + Cloudflare 无状态 CORS 代理。'
          pkg['scripts']['check']='node --check app.js && node --check browser-runtime.js && node --check provider-adapter-contract.js && node --check provider-runtime-core.js && node --check provider-auto-config-v1.js && node --check models.js && node --check server.js && node --check store.js && node --check three-runtime.js && node --check ui-zh.js && node --check ui-v23.js && node --check ui-connect-v23.js'
          (root/'package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          (root/'PREVIEW_ARCHITECTURE.md').write_text('''# Online preview architecture\n\nCloudflare is **preview transport only**. It is not the application database.\n\n## Browser-owned preview data\n\nThe browser runtime owns provider configuration (including the API key), projects, task history and queue state. Existing `/api/providers`, `/api/projects`, `/api/tasks` and `/api/queue` calls are intercepted before network access and backed by browser-local storage.\n\n## Provider runtime\n\n`provider-adapter-contract.js` and `provider-runtime-core.js` remain platform-neutral. Model discovery, authentication candidates, request routing, asynchronous task IDs, polling, terminal-state classification and output extraction do not depend on Cloudflare.\n\n## Cloudflare responsibilities\n\nCloudflare Pages serves HTML/CSS/JS. Pages Function `/api/proxy` is a stateless CORS fallback. The browser tries the provider directly first; only a browser CORS/network failure uses `/api/proxy`. The proxy does not write provider keys, providers, projects, tasks, media or sessions anywhere.\n\n`/api/health` is the only other server route. All former stateful API routes return 410 if Browser Runtime is not loaded.\n\n## Not available in web preview\n\nFFmpeg/ImageMagick processing and Blender live bridge are desktop-local capabilities. They must not fake success or store state on Cloudflare.\n''',encoding='utf-8')

          test=root/'tests'/'browser-local-runtime.test.mjs'
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const ROOT=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const runtime=fs.readFileSync(path.join(ROOT,'browser-runtime.js'),'utf8');
          const proxy=fs.readFileSync(path.join(ROOT,'functions/api/[[path]].js'),'utf8');
          const wrangler=fs.readFileSync(path.join(ROOT,'wrangler.toml'),'utf8');
          const index=fs.readFileSync(path.join(ROOT,'index.html'),'utf8');
          const models=fs.readFileSync(path.join(ROOT,'models.html'),'utf8');

          test('preview persistence belongs to browser runtime',()=>{
            assert.match(runtime,/fuiet-browser-providers-v1/);
            assert.match(runtime,/fuiet-browser-projects-v1/);
            assert.match(runtime,/fuiet-browser-tasks-v1/);
            assert.match(runtime,/localStorage\.setItem/);
            assert.match(runtime,/cloudflarePersistence:false/);
          });
          test('provider core executes before application UI',()=>{
            for(const html of [index,models]){
              const adapter=html.indexOf('provider-adapter-contract.js');
              const core=html.indexOf('provider-runtime-core.js');
              const browser=html.indexOf('browser-runtime.js');
              assert.ok(adapter>=0&&core>adapter&&browser>core);
            }
            assert.ok(index.indexOf('app.js')>index.indexOf('browser-runtime.js'));
            assert.ok(models.indexOf('models.js')>models.indexOf('browser-runtime.js'));
          });
          test('Cloudflare function is stateless proxy only',()=>{
            assert.match(proxy,/pathname==='\/api\/proxy'/);
            assert.match(proxy,/pathname==='\/api\/health'/);
            assert.match(proxy,/persistence:false/);
            assert.doesNotMatch(proxy,/SUPABASE|D1Database|R2Bucket|KVNamespace|writeJSONStore|providers\s*:/i);
            assert.doesNotMatch(wrangler,/SUPABASE|PROVIDER_SECRET_KEY|D1|R2|KV|CANVAS_OWNER/i);
          });
          test('stateful Cloudflare server and Supabase migrations are removed',()=>{
            assert.equal(fs.existsSync(path.join(ROOT,'dist/server')),false);
            assert.equal(fs.existsSync(path.join(ROOT,'supabase')),false);
            assert.equal(fs.existsSync(path.join(ROOT,'functions/media')),false);
          });
          test('browser provider flow uses direct request then stateless proxy fallback',()=>{
            assert.match(runtime,/return await rawFetch\(url,\{\.\.\.init,mode:'cors'/);
            assert.match(runtime,/return proxyFetch\(url,init\)/);
            assert.match(runtime,/authCandidates/);
            assert.match(runtime,/\/v1\/models/);
            assert.match(runtime,/classifyAsyncPoll/);
          });
          ''',encoding='utf-8')
          PY

          rm -f .github/workflows/apply-browser-local-runtime-v1.yml

      - name: Validate browser-local preview
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make Cloudflare preview stateless and keep data in browser"
          git pull --rebase origin feature/browser-local-runtime
          git push origin HEAD:feature/browser-local-runtime
