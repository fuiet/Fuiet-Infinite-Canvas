name: Harden Node Provider Security

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harden-node-provider-security-v1.yml'
      - '_read_123_zip_20260821_180410/scripts/harden-node-provider-security-v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Node provider security hardening
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/harden-node-provider-security-v1.py
      - name: Validate Node gateway syntax
        working-directory: _read_123_zip_20260821_180410
        run: node --check server.js
      - name: Run Node provider security regression
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/node-provider-security.test.mjs
      - name: Run provider checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit hardened Node gateway
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/server.js \
                  _read_123_zip_20260821_180410/tests/node-provider-security.test.mjs
          git commit -m 'Harden Node provider redirects and header redaction'
          git push origin HEAD:main
