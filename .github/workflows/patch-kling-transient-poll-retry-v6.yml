name: Patch Kling transient poll retry v6

on:
  push:
    branches: [kling-transient-poll-retry-v6]
    paths:
      - '.github/workflows/patch-kling-transient-poll-retry-v6.yml'
      - '_read_123_zip_20260821_180410/scripts/patch-kling-transient-poll-retry-v6.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kling-transient-poll-retry-v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply transient polling fix
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/patch-kling-transient-poll-retry-v6.cjs
      - name: Check and test
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Retry transient video polling failures without resubmitting"
          git push origin HEAD:kling-transient-poll-retry-v6
