name: Apply provider API v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-provider-api-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch provider runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root=Path('_read_123_zip_20260821_180410')

          def read(rel): return (root/rel).read_text()
          def write(rel,text): (root/rel).write_text(text)
          def replace_once(rel,old,new):
              p=root/rel; s=p.read_text()
              if old not in s: raise SystemExit(f'missing exact snippet in {rel}: {old[:100]!r}')
              if s.count(old)!=1: raise SystemExit(f'expected one occurrence in {rel}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          def replace_block(rel,start,end,new_block):
              p=root/rel; s=p.read_text(); a=s.find(start)
              if a<0: raise SystemExit(f'missing start marker in {rel}: {start}')
              b=s.find(end,a+len(start))
              if b<0: raise SystemExit(f'missing end marker in {rel}: {end}')
              p.write_text(s[:a]+new_block.rstrip()+"\n\n"+s[b:])

          contract=r'''/* Shared provider adapter contract.
           * Loaded as a side-effect by both Node (require) and Cloudflare Worker (import).
           * Keep this file free of Node-only and Worker-only APIs.
           */
          (()=>{
          'use strict';
          const SUCCESS=['completed','succeeded','success','done','finished'];
          const FAILURE=['failed','error','canceled','cancelled'];
          const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
          const compact=o=>{const out={};for(const [k,v] of Object.entries(o||{}))if(v!==undefined&&v!==null&&v!=='')out[k]=v;return out};
          const clamp=(v,min,max,fallback)=>{const n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback};
          function normalizeReferenceTransport(value,{cloud=false}={}){
            let v=String(value||'auto').trim().toLowerCase();
            if(v==='base64')v='data-url';
            if(v==='public-url')v='url';
            if(v==='upload-endpoint')v='upload';
            if(!v||v==='auto')return cloud?'data-url':'auto';
            return ['data-url','url','upload'].includes(v)?v:(cloud?'data-url':'auto');
          }
          function inferAdapterKey(provider={},model={}){
            const explicit=String(model.adapterKey||'auto').trim();
            if(explicit&&explicit!=='auto')return explicit;
            if(provider.protocol==='comfyui')return 'comfyui-workflow';
            const mod=String(model.modality||'image');
            if(provider.protocol==='openai-compatible'){
              if(mod==='text'||mod==='script')return 'openai-chat';
              if(mod==='image')return 'openai-image';
              if(mod==='audio')return 'openai-audio-speech';
            }
            const route=String(model.createPath||model.operationRoutes?.generate?.createPath||'').toLowerCase();
            if(/\/responses(?:$|\?)/.test(route))return 'openai-responses';
            if(/\/chat\/completions(?:$|\?)/.test(route))return 'openai-chat';
            if(/\/images\/generations(?:$|\?)/.test(route))return 'openai-image';
            if(/\/audio\/speech(?:$|\?)/.test(route))return 'openai-audio-speech';
            if(mod==='video'&&provider.videoProtocol==='standard-video-async-v1')return 'standard-video-async-v1';
            if(route)return (model.responseMode==='async'||model.operationRoutes?.generate?.responseMode==='async')?'generic-async':'generic-sync';
            return 'auto';
          }
          function adapterDefaults(key,nodeType){
            if(key==='openai-chat')return{createPath:'/v1/chat/completions',method:'POST',responseMode:'sync',outputPath:'choices.0.message.content'};
            if(key==='openai-responses')return{createPath:'/v1/responses',method:'POST',responseMode:'sync',outputPath:'output.0.content.0.text'};
            if(key==='openai-image')return{createPath:'/v1/images/generations',method:'POST',responseMode:'sync',outputPath:'data.0.url'};
            if(key==='openai-audio-speech')return{createPath:'/v1/audio/speech',method:'POST',responseMode:'sync',outputPath:''};
            if(key==='comfyui-workflow')return{createPath:'/prompt',method:'POST',responseMode:'async',taskIdPath:'prompt_id',pollPath:'/history/{{taskId}}',pollMethod:'GET'};
            if(key==='standard-video-async-v1')return{createPath:'/v1/video/generations',method:'POST',responseMode:'async',taskIdPath:'',pollPath:'/v1/video/generations/{{taskId}}',pollMethod:'GET',statusPath:'',progressPath:'',outputPath:'',successValues:SUCCESS,failureValues:FAILURE,pollIntervalMs:1500,timeoutMs:1200000};
            if(key==='generic-async')return{createPath:'',method:'POST',responseMode:'async',pollMethod:'GET',successValues:SUCCESS,failureValues:FAILURE,pollIntervalMs:1500,timeoutMs:1200000};
            if(key==='generic-sync')return{createPath:'',method:'POST',responseMode:'sync'};
            return{createPath:'',method:'POST',responseMode:nodeType==='video'?'async':'sync',pollMethod:'GET',successValues:SUCCESS,failureValues:FAILURE,pollIntervalMs:1500,timeoutMs:1200000};
          }
          function resolveRoute(provider={},model={},nodeType='',operation='generate'){
            const adapterKey=inferAdapterKey(provider,model);
            const defaults=adapterDefaults(adapterKey,nodeType);
            const providerVideo=nodeType==='video'?compact(provider.videoProtocolConfig||{}):{};
            const direct=compact({
              createPath:model.createPath,method:model.method,responseMode:model.responseMode,outputPath:model.outputPath,
              taskIdPath:model.taskIdPath,pollPath:model.pollPath,pollMethod:model.pollMethod,pollBodyTemplate:model.pollBodyTemplate,
              statusPath:model.statusPath,progressPath:model.progressPath,successValues:model.successValues,failureValues:model.failureValues,
              pollIntervalMs:model.pollIntervalMs,timeoutMs:model.timeoutMs,requestTemplate:model.requestTemplate,
              allowOutputWithoutTerminalStatus:model.allowOutputWithoutTerminalStatus
            });
            const op=compact(model.operationRoutes?.[operation]||model.operationRoutes?.generate||{});
            const route={...defaults,...providerVideo,...direct,...op,adapterKey};
            route.method=String(route.method||'POST').toUpperCase();
            route.pollMethod=String(route.pollMethod||'GET').toUpperCase();
            route.successValues=Array.isArray(route.successValues)&&route.successValues.length?route.successValues:SUCCESS;
            route.failureValues=Array.isArray(route.failureValues)&&route.failureValues.length?route.failureValues:FAILURE;
            route.pollIntervalMs=clamp(route.pollIntervalMs,500,30000,1500);
            route.timeoutMs=clamp(route.timeoutMs,5000,3600000,1200000);
            return route;
          }
          function detectModelListProtocol(data,endpoint=''){
            const list=Array.isArray(data?.data)?data.data:null;
            if(!list)return{protocol:'',confidence:0,reason:'response-not-openai-list'};
            const objects=list.filter(x=>x&&typeof x==='object');
            const withIds=objects.filter(x=>typeof x.id==='string'&&x.id.trim()).length;
            const modelObjects=objects.filter(x=>String(x.object||'').toLowerCase()==='model').length;
            if(data?.object==='list'&&withIds===objects.length&&objects.length>0)return{protocol:'openai-compatible',confidence:.99,reason:'object=list + data[id]'};
            if(objects.length>0&&modelObjects/objects.length>=.8&&withIds/objects.length>=.8)return{protocol:'openai-compatible',confidence:.96,reason:'data[].object=model'};
            return{protocol:'',confidence:0,reason:`generic-model-list:${endpoint||'unknown'}`};
          }
          globalThis.CanvasProviderAdapters=Object.freeze({SUCCESS,FAILURE,normalizeReferenceTransport,inferAdapterKey,adapterDefaults,resolveRoute,detectModelListProtocol});
          })();
          '''
          write('provider-adapter-contract.js',contract)

          # ---------- Node server ----------
          replace_once('server.js',
            "const { CanvasStore } = require('./store');\nconst execFileAsync = promisify(execFile);",
            "const { CanvasStore } = require('./store');\nrequire('./provider-adapter-contract.js');\nconst ProviderAdapterContract = globalThis.CanvasProviderAdapters;\nconst execFileAsync = promisify(execFile);")

          new_video_cfg=r'''function normalizeVideoProtocolConfig(input={}, existing={}) {
            const raw=(input&&typeof input==='object')?input:{};
            const old=(existing&&typeof existing==='object')?existing:{};
            const arr=(v,fallback)=>Array.isArray(v)&&v.length?v.map(String).map(x=>x.trim()).filter(Boolean):fallback;
            return {
              createPath:String(raw.createPath ?? old.createPath ?? '/v1/video/generations').trim() || '/v1/video/generations',
              createMethod:String(raw.createMethod ?? old.createMethod ?? raw.method ?? old.method ?? 'POST').trim().toUpperCase() || 'POST',
              requestTemplate:(raw.requestTemplate&&typeof raw.requestTemplate==='object')?raw.requestTemplate:((old.requestTemplate&&typeof old.requestTemplate==='object')?old.requestTemplate:{}),
              pollPath:String(raw.pollPath ?? old.pollPath ?? '/v1/video/generations/{{taskId}}').trim() || '/v1/video/generations/{{taskId}}',
              pollMethod:String(raw.pollMethod ?? old.pollMethod ?? 'GET').trim().toUpperCase() || 'GET',
              pollBodyTemplate:(raw.pollBodyTemplate&&typeof raw.pollBodyTemplate==='object')?raw.pollBodyTemplate:((old.pollBodyTemplate&&typeof old.pollBodyTemplate==='object')?old.pollBodyTemplate:null),
              taskIdPath:String(raw.taskIdPath ?? old.taskIdPath ?? '').trim(),
              statusPath:String(raw.statusPath ?? old.statusPath ?? '').trim(),
              progressPath:String(raw.progressPath ?? old.progressPath ?? '').trim(),
              outputPath:String(raw.outputPath ?? old.outputPath ?? '').trim(),
              successValues:arr(raw.successValues ?? old.successValues,['succeeded','completed','success','done','finished']),
              failureValues:arr(raw.failureValues ?? old.failureValues,['failed','error','cancelled','canceled']),
              pollIntervalMs:Math.max(500,Number(raw.pollIntervalMs ?? old.pollIntervalMs ?? 1500)),
              timeoutMs:Math.max(5000,Number(raw.timeoutMs ?? old.timeoutMs ?? 20*60*1000)),
              allowOutputWithoutTerminalStatus:raw.allowOutputWithoutTerminalStatus === true || old.allowOutputWithoutTerminalStatus === true
            };
          }'''
          replace_block('server.js','function normalizeVideoProtocolConfig(input={}, existing={}) {','function normalizeProvider(input, existing) {',new_video_cfg)

          s=read('server.js')
          s=s.replace("protocol: ['generic-rest', 'openai-compatible', 'comfyui'].includes(input.protocol) ? input.protocol : (existing?.protocol || 'generic-rest'),","protocol: ['auto','generic-rest', 'openai-compatible', 'comfyui'].includes(input.protocol) ? input.protocol : (existing?.protocol || 'auto'),")
          s=s.replace("referenceTransport: ['auto','base64','public-url','upload-endpoint'].includes(input.referenceTransport) ? input.referenceTransport : (existing?.referenceTransport || 'auto'),","referenceTransport: ProviderAdapterContract.normalizeReferenceTransport(input.referenceTransport ?? existing?.referenceTransport ?? 'auto',{cloud:false}),")
          # Stop auto-promoting every video vendor into one invented standard protocol.
          s=re.sub(r"\n  const hasVideoModels = \(p\.models \|\| \[\]\)\.some\(m => String\(m\?\.modality \|\| ''\)\.trim\(\) === 'video'\);\n  if \(p\.protocol !== 'comfyui' && hasVideoModels && providerHasApiKey\(p\) && p\.videoProtocol === 'auto'\) \{\n    p\.videoProtocol = 'standard-video-async-v1';\n    p\.videoProtocolConfig = normalizeVideoProtocolConfig\(p\.videoProtocolConfig, existing\?\.videoProtocolConfig\);\n  \}","",s,count=1)
          write('server.js',s)

          new_infer=r'''function inferAdapterKey(provider,model){
            return ProviderAdapterContract.inferAdapterKey(provider,model);
          }'''
          replace_block('server.js','function inferAdapterKey(provider,model){','function adapterInfo(provider,model)',new_infer)

          # Canonical reference transport aliases while preserving Node's convenient auto behavior.
          old="const file=mediaPathFromUrl(url);const transport=provider.referenceTransport||'auto';\n      if(transport==='upload-endpoint')url=await uploadReferenceToProvider(provider,file);\n      else if(transport==='public-url'||(transport==='auto'&&provider.publicBaseUrl)) {"
          new="const file=mediaPathFromUrl(url);const transport=ProviderAdapterContract.normalizeReferenceTransport(provider.referenceTransport,{cloud:false});\n      if(transport==='upload')url=await uploadReferenceToProvider(provider,file);\n      else if(transport==='url'||(transport==='auto'&&provider.publicBaseUrl)) {"
          if old not in read('server.js'): raise SystemExit('Node reference transport snippet not found')
          replace_once('server.js',old,new)

          new_detect=r'''function detectModelListProtocol(data,route=''){
            return ProviderAdapterContract.detectModelListProtocol(data,route).protocol;
          }'''
          replace_block('server.js','function detectModelListProtocol(data,route=\'\'){','async function fetchModelsFromProvider(provider) {',new_detect)

          new_test_config=r'''async function testProviderConfig(input) {
            const existing = input.id ? loadProvidersRaw().find(p => p.id === input.id) : null;
            const provider = normalizeProvider(input, existing || null);
            if (!provider.baseUrl) throw new Error('Base URL 不能为空');
            providerHeaders(provider);
            const route = provider.testPath || (provider.protocol === 'comfyui' ? '/system_stats' : '');
            const target = route ? joinUrl(provider.baseUrl, route) : provider.baseUrl;
            const res = await fetchSafe(target,{method:'GET',headers:providerHeaders(provider),timeoutMs:15000},provider);
            const raw=await res.text();
            return {
              ok:true, reachable:true, endpoint:route||'/', httpStatus:res.status,
              preview:raw.slice(0,500),
              warning:res.ok?'':`已连接到上游，但返回 HTTP ${res.status}。连接可达不等于鉴权或生成接口可用，请继续执行「测试鉴权」。`
            };
          }'''
          replace_block('server.js','async function testProviderConfig(input) {','async function testProviderAuth(input) {',new_test_config)

          new_test_auth=r'''async function testProviderAuth(input) {
            const existing = input.id ? loadProvidersRaw().find(p => p.id === input.id) : null;
            const provider = normalizeProvider(input, existing || null);
            if (!provider.baseUrl) throw new Error('Base URL 不能为空');
            providerHeaders(provider);
            if(provider.testPath){
              const data=await fetchJson(joinUrl(provider.baseUrl,provider.testPath),{method:'GET',headers:providerHeaders(provider),timeoutMs:15000,provider});
              return {ok:true,verified:true,endpoint:provider.testPath,mode:'test-path',preview:JSON.stringify(data).slice(0,300)};
            }
            try{
              const discovered=await fetchModelsFromProvider(provider);
              return {ok:true,verified:true,endpoint:discovered.endpoint,modelCount:discovered.models.length,mode:'model-list'};
            }catch(error){
              return {ok:true,verified:false,mode:'unverified',warning:`当前供应商没有可安全用于鉴权验证的模型列表/测试接口。为避免调用图片或视频生成接口产生费用，本次不发送生成请求。${error.message}`};
            }
          }'''
          replace_block('server.js','async function testProviderAuth(input) {','async function diagnoseProvider(input){',new_test_auth)

          new_diagnose=r'''async function diagnoseProvider(input){
            const existing=input.id?loadProvidersRaw().find(p=>p.id===input.id):null;
            const provider=normalizeProvider(input,existing||null);
            const report={ok:true,connection:{ok:false},auth:{ok:false,verified:false},models:{discoveryOk:false,total:0,ready:0,pending:0,byType:{text:0,image:0,video:0,audio:0}},warnings:[]};
            try{const r=await testProviderConfig(input);report.connection={ok:true,endpoint:r.endpoint||'',httpStatus:r.httpStatus||0,warning:r.warning||''};if(r.warning)report.warnings.push(r.warning)}catch(e){report.ok=false;report.connection={ok:false,error:e.message}}
            try{const r=await testProviderAuth(input);report.auth={ok:true,verified:r.verified!==false,endpoint:r.endpoint||'',modelId:r.modelId||'',mode:r.mode||'',warning:r.warning||''};if(r.warning)report.warnings.push(r.warning)}catch(e){report.ok=false;report.auth={ok:false,verified:false,error:e.message}}
            try{const d=await fetchModelsFromProvider(provider);report.models.discoveryOk=true;report.models.discovered=d.models.length;report.models.endpoint=d.endpoint||'';report.models.suggestedProtocol=d.suggestedProtocol||''}catch(e){report.models.discoveryError=e.message;report.warnings.push('模型发现：'+e.message)}
            const models=(provider.models||[]).filter(m=>m.enabled!==false);report.models.total=models.length;
            for(const m of models){const info=adapterInfo(provider,m);report.models.byType[m.modality]=(report.models.byType[m.modality]||0)+1;if(info.ready)report.models.ready++;else{report.models.pending++;report.warnings.push(`模型 ${m.name||m.id} 尚未完成适配`)}}
            if(!models.length)report.warnings.push('当前尚未保存模型；供应商仍可保存，之后可拉取或手动添加模型。');
            return report;
          }'''
          replace_block('server.js','async function diagnoseProvider(input){','async function discoverProviderModels(input) {',new_diagnose)

          # Generic async polling: support POST/PUT etc and JSON poll body templates.
          replace_once('server.js',
            "const pollPath=opConfig.pollPath||model.pollPath||'/v1/tasks/{{taskId}}';const pollUrl = joinUrl(provider.baseUrl, renderPathTemplate(pollPath, pollCtx));\n    const polled = await fetchJson(pollUrl, { method:'GET', headers:providerHeaders(provider), timeoutMs:60000, provider });",
            "const pollPath=opConfig.pollPath||model.pollPath||'/v1/tasks/{{taskId}}';const pollUrl = joinUrl(provider.baseUrl, renderPathTemplate(pollPath, pollCtx));\n    const pollMethod=String(opConfig.pollMethod||model.pollMethod||'GET').toUpperCase();\n    const pollTemplate=opConfig.pollBodyTemplate??model.pollBodyTemplate;\n    const pollBody=pollTemplate&&typeof pollTemplate==='object'?renderTemplate(pollTemplate,pollCtx):undefined;\n    const polled = await fetchJson(pollUrl, { method:pollMethod, headers:providerHeaders(provider), body:['GET','HEAD'].includes(pollMethod)?undefined:(pollBody===undefined?undefined:JSON.stringify(pollBody)), timeoutMs:60000, provider });")

          new_std_video=r'''async function executeStandardVideoAsync(task,provider,model,payload){
            if(task.nodeType!=='video')throw new Error('标准异步视频协议只能用于视频模型');
            const config=normalizeVideoProtocolConfig(provider.videoProtocolConfig,provider.videoProtocolConfig);
            const createPath=String(config.createPath||'/v1/video/generations');
            const createUrl=joinUrl(provider.baseUrl,createPath);
            const ctx={model:model.id,modelId:model.id,prompt:payload.prompt||'',parameters:payload.parameters||{},params:payload.parameters||{},references:payload.references||[]};
            const body=config.requestTemplate&&Object.keys(config.requestTemplate).length?renderTemplate(config.requestTemplate,ctx):standardVideoBody(model,payload);
            updateTask(task,{progress:8});
            let taskId='';
            const resume=payload._upstream&&payload._upstream.protocol==='standard-video-async-v1'&&payload._upstream.modelId===model.id?payload._upstream:null;
            if(resume?.id){taskId=String(resume.id);taskLog(task,`恢复标准视频任务：${taskId}`)}
            else{
              const createMethod=String(config.createMethod||'POST').toUpperCase();
              taskLog(task,`标准异步视频：${createMethod} ${createPath}`);
              const created=await fetchJson(createUrl,{method:createMethod,headers:providerHeaders(provider),body:['GET','HEAD'].includes(createMethod)?undefined:JSON.stringify(body),timeoutMs:Math.min(config.timeoutMs,120000),provider});
              taskId=standardVideoTaskId(created,config);
              if(!taskId)throw new Error('视频任务已提交，但响应中未找到任务 ID。可在供应商/模型高级配置中设置 taskIdPath。');
              payload._upstream={protocol:'standard-video-async-v1',modelId:model.id,id:String(taskId),createdAt:new Date().toISOString()};
              task.payload=payload;updateTask(task,{payload,progress:20});taskLog(task,`已持久化视频任务 ID：${taskId}`);
            }
            const started=Date.now();let checks=0;
            const success=(config.successValues||[]).map(x=>String(x).toLowerCase()),failure=(config.failureValues||[]).map(x=>String(x).toLowerCase());
            while(Date.now()-started<config.timeoutMs){
              assertTaskActive(task);await new Promise(r=>setTimeout(r,config.pollIntervalMs));checks++;
              const pollCtx={...ctx,taskId};
              const pollPath=renderPathTemplate(config.pollPath||'/v1/video/generations/{{taskId}}',pollCtx);
              const pollMethod=String(config.pollMethod||'GET').toUpperCase();
              const pollBody=config.pollBodyTemplate&&typeof config.pollBodyTemplate==='object'?renderTemplate(config.pollBodyTemplate,pollCtx):undefined;
              const polled=await fetchJson(joinUrl(provider.baseUrl,pollPath),{method:pollMethod,headers:providerHeaders(provider),body:['GET','HEAD'].includes(pollMethod)?undefined:(pollBody===undefined?undefined:JSON.stringify(pollBody)),timeoutMs:60000,provider});
              const statusRaw=standardVideoStatus(polled,config),status=String(statusRaw??'').toLowerCase();
              const progressRaw=Number(standardVideoProgress(polled,config));
              updateTask(task,{status:'polling',progress:Number.isFinite(progressRaw)?Math.max(20,Math.min(96,progressRaw)):Math.min(94,20+checks*4)});
              if(failure.includes(status))throw new Error(`上游视频任务失败：${status||'unknown'}`);
              const output=standardVideoOutput(polled,config);
              if(success.includes(status)||(config.allowOutputWithoutTerminalStatus===true&&!status&&output!=null)){
                if(output==null)throw new Error(`视频任务状态为 ${status||'成功'}，但没有解析到视频结果 URL。请配置 outputPath。`);
                return normalizeOutput(output,'video',provider);
              }
            }
            throw new Error('标准异步视频任务超时');
          }'''
          replace_block('server.js','async function executeStandardVideoAsync(task,provider,model,payload){','async function executeOpenAI(task, provider, model, payload) {',new_std_video)

          # Normalize model must retain generic poll controls.
          replace_once('server.js',
            "pollPath: String(m.pollPath || '').trim(),\n    statusPath: String(m.statusPath || '').trim(),",
            "pollPath: String(m.pollPath || '').trim(),\n    pollMethod: String(m.pollMethod || 'GET').trim().toUpperCase(),\n    pollBodyTemplate: (m.pollBodyTemplate&&typeof m.pollBodyTemplate==='object')?m.pollBodyTemplate:null,\n    statusPath: String(m.statusPath || '').trim(),")

          # ---------- Worker secure runtime ----------
          replace_once('dist/server/secure-index.js',
            "import legacyWorker from './index.js';",
            "import legacyWorker from './index.js';\nimport '../../provider-adapter-contract.js';\nconst ProviderAdapterContract = globalThis.CanvasProviderAdapters;")

          replace_once('dist/server/secure-index.js',
            "model.enabled = model.enabled !== false;\n  model.operationRoutes",
            "model.enabled = model.enabled !== false;\n  model.adapterKey = String(model.adapterKey || 'auto').trim() || 'auto';\n  model.operationRoutes")

          s=read('dist/server/secure-index.js')
          s=s.replace("next.protocol = String(next.protocol || 'openai-compatible');","next.protocol = ['auto','generic-rest','openai-compatible','comfyui'].includes(String(next.protocol)) ? String(next.protocol) : 'auto';")
          s=s.replace("next.referenceTransport = String(next.referenceTransport || 'url');","next.referenceTransport = ProviderAdapterContract.normalizeReferenceTransport(next.referenceTransport,{cloud:true});")
          write('dist/server/secure-index.js',s)

          # Worker model-list protocol detection is evidence based.
          replace_once('dist/server/secure-index.js',
            "const models = normalizeDiscoveredModels(await parseJsonResponse(res));\n        if (models.length) return { endpoint, models, auth };",
            "const data = await parseJsonResponse(res);\n        const models = normalizeDiscoveredModels(data);\n        const protocolEvidence = ProviderAdapterContract.detectModelListProtocol(data, endpoint);\n        if (models.length) return { endpoint, models, auth, suggestedProtocol: protocolEvidence.protocol, protocolEvidence };"
          )

          new_worker_route=r'''function routeForTask(provider, model, nodeType) {
            const operation=String(model?.operationRoutes?.activeOperation||'generate');
            return ProviderAdapterContract.resolveRoute(provider,model,nodeType,operation);
          }'''
          replace_block('dist/server/secure-index.js','function routeForTask(provider, model, nodeType) {','function replaceTemplate(value, context) {',new_worker_route)

          # Worker reference transport aliases/default.
          old_ref="if (provider.referenceTransport === 'data-url') {\n        const media = await getLocalMedia(ref.url, request, env, ctx); ref.url = bytesToDataUrl(media.bytes, media.contentType);\n      } else if (provider.referenceTransport === 'upload') {\n        ref.url = await uploadReference(provider, model, ref, request, env, ctx);\n      } else {"
          new_ref="const transport=ProviderAdapterContract.normalizeReferenceTransport(provider.referenceTransport,{cloud:true});\n      if (transport === 'data-url') {\n        const media = await getLocalMedia(ref.url, request, env, ctx); ref.url = bytesToDataUrl(media.bytes, media.contentType);\n      } else if (transport === 'upload') {\n        ref.url = await uploadReference(provider, model, ref, request, env, ctx);\n      } else {"
          replace_once('dist/server/secure-index.js',old_ref,new_ref)

          # Worker generic polling supports arbitrary HTTP method and JSON body template.
          replace_once('dist/server/secure-index.js',
            "const pollUrl = resolveProviderUrl(provider, pollPath, env);\n  const res = await safeProviderFetch(provider, pollUrl, { method: 'GET', headers: buildHeaders(provider, model, null, null), timeoutMs: 30000 }, env);",
