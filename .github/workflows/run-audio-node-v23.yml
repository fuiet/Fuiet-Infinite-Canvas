name: Run Audio Node UI 2.3 Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '.github/workflows/run-audio-node-v23.yml'
      - '_read_123_zip_20260821_180410/scripts/implement-audio-node-v23.py'
      - '_read_123_zip_20260821_180410/styles/audio-node.css'
      - '_read_123_zip_20260821_180410/tests/audio-node-v23.test.mjs'
      - '_read_123_zip_20260821_180410/tests/image-node-libtv.test.mjs'
      - '_read_123_zip_20260821_180410/tests/video-node-v23.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/video-worker-hardening-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audio node migration
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/implement-audio-node-v23.py
      - name: Validate JavaScript syntax
        working-directory: _read_123_zip_20260821_180410
        run: node --check app.js
      - name: Validate app checks
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Validate existing tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Validate audio node contract
        working-directory: _read_123_zip_20260821_180410
        run: node tests/audio-node-v23.test.mjs
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit audio node implementation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js \
                  _read_123_zip_20260821_180410/index.html
          git commit -m 'Apply UI 2.3 audio node behavior'
          git push origin HEAD:security/video-worker-hardening-20260825