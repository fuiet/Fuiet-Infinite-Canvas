name: Move text model picker to composer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-text-model-picker-to-composer.py'
      - '.github/workflows/patch-text-model-picker-to-composer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        run: python scripts/patch-text-model-picker-to-composer.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/styles/text-node.css _read_123_zip_20260821_180410/tests/text-node-v23.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Move text model picker to composer'
          git push origin main
