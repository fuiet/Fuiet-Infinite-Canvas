name: Fix Client Task Poll Contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-client-task-poll-contract-v1.yml'
      - '_read_123_zip_20260821_180410/scripts/fix-client-task-poll-contract-v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply client polling contract fix
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/fix-client-task-poll-contract-v1.py
      - name: Validate client syntax and polling contract
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check app.js
          node --test tests/task-poll-client-contract.test.mjs
      - name: Run full checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit client polling contract fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js \
                  _read_123_zip_20260821_180410/tests/task-poll-client-contract.test.mjs
          git commit -m 'Keep upstream polling state server-owned'
          git push origin HEAD:main
