name: Fix Provider Secret Fallback V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-provider-secret-fallback-v1.py'
      - '.github/workflows/fix-provider-secret-fallback-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fallback patch
        run: python scripts/fix-provider-secret-fallback-v1.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/dist/server/secure-index.js \
                  _read_123_zip_20260821_180410/dist/server/secure-entry.js \
                  _read_123_zip_20260821_180410/tests/provider-secret-fallback.test.mjs
          if git diff --cached --quiet; then
            echo "No runtime changes needed"
          else
            git commit -m "Use Supabase service role as provider encryption fallback"
            git push origin HEAD:main
          fi
