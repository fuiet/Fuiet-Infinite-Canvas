name: Apply Browser Local Runtime V2

on:
  push:
    branches: [feature/browser-local-runtime]
    paths: ['.github/workflows/apply-browser-local-runtime-v2.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply stateless preview architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('_read_123_zip_20260821_180410')
          for name in ['index.html','models.html']:
              p=root/name;text=p.read_text(encoding='utf-8')
              anchor='<script src="./provider-adapter-contract.js?v=20260827-autoconfig-2"></script>'
              if 'browser-runtime.js' not in text:
                  if anchor not in text: raise SystemExit(f'missing adapter anchor: {name}')
                  text=text.replace(anchor,anchor+'\n  <script src="./provider-runtime-core.js?v=20260828-browser-runtime-1"></script>\n  <script src="./browser-runtime.js?v=20260828-browser-runtime-1"></script>',1)
              p.write_text(text,encoding='utf-8')
          shutil.rmtree(root/'dist'/'server',ignore_errors=True)
          shutil.rmtree(root/'supabase',ignore_errors=True)
          shutil.rmtree(root/'functions'/'media',ignore_errors=True)
          for test in (root/'tests').glob('*.test.mjs'):
              text=test.read_text(encoding='utf-8',errors='ignore')
              if any(m in text for m in ['dist/server/','pages-entry.js','secure-entry.js','production-entry.js','SUPABASE_SERVICE_ROLE_KEY','CANVAS_ENFORCE_OWNER','owner-resolver.js']):
                  test.unlink()
          (root/'wrangler.toml').write_text('''name = "fuiet-infinite-canvas"\ncompatibility_date = "2026-08-28"\npages_build_output_dir = "."\n\n[vars]\nCANVAS_PREVIEW_MODE = "stateless-browser"\n\n# Preview transport only. Persistent application data belongs to the browser.\n# No application database or object-storage binding is required for this deployment.\n''',encoding='utf-8')
          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          pkg['name']='fuiet-infinite-canvas-preview';pkg['version']='4.5.0'
          pkg['description']='Fuiet Infinite Canvas 在线开发预览版：浏览器本地数据 + 平台无关 Provider Core + Cloudflare 无状态 CORS 代理。'
          pkg['scripts']['check']='node --check app.js && node --check browser-runtime.js && node --check provider-adapter-contract.js && node --check provider-runtime-core.js && node --check provider-auto-config-v1.js && node --check models.js && node --check server.js && node --check store.js && node --check three-runtime.js && node --check ui-zh.js && node --check ui-v23.js && node --check ui-connect-v23.js'
          (root/'package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'PREVIEW_ARCHITECTURE.md').write_text('''# Online preview architecture\n\nCloudflare is preview transport only; it is not the application database.\n\nBrowser Runtime owns provider configuration (including API keys), projects, task history and queue state. Existing data API calls are intercepted before network access and backed by browser-local storage.\n\n`provider-adapter-contract.js` and `provider-runtime-core.js` remain platform-neutral. Model discovery, authentication candidates, request routing, asynchronous task IDs, polling, terminal-state classification and output extraction do not depend on Cloudflare.\n\nThe browser tries the provider directly first. Only a browser CORS/network failure uses `/api/proxy`. That Pages Function forwards one upstream request and writes nothing. `/api/health` is the only other Cloudflare API route.\n\nFFmpeg/ImageMagick processing and Blender live bridge are desktop-local capabilities and intentionally do not fake success in the online preview.\n''',encoding='utf-8')
          (root/'tests'/'browser-local-runtime.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const ROOT=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const runtime=fs.readFileSync(path.join(ROOT,'browser-runtime.js'),'utf8');
          const proxy=fs.readFileSync(path.join(ROOT,'functions/api/[[path]].js'),'utf8');
          const wrangler=fs.readFileSync(path.join(ROOT,'wrangler.toml'),'utf8');
          const activeWrangler=wrangler.split(/\r?\n/).filter(x=>!x.trim().startsWith('#')).join('\n');
          const index=fs.readFileSync(path.join(ROOT,'index.html'),'utf8');
          const models=fs.readFileSync(path.join(ROOT,'models.html'),'utf8');
          test('preview persistence belongs to browser runtime',()=>{assert.match(runtime,/fuiet-browser-providers-v1/);assert.match(runtime,/fuiet-browser-projects-v1/);assert.match(runtime,/fuiet-browser-tasks-v1/);assert.match(runtime,/localStorage\.setItem/);assert.match(runtime,/cloudflarePersistence:false/)});
          test('provider core executes before application UI',()=>{for(const html of [index,models]){const a=html.indexOf('provider-adapter-contract.js'),c=html.indexOf('provider-runtime-core.js'),b=html.indexOf('browser-runtime.js');assert.ok(a>=0&&c>a&&b>c)}assert.ok(index.indexOf('app.js')>index.indexOf('browser-runtime.js'));assert.ok(models.indexOf('models.js')>models.indexOf('browser-runtime.js'))});
          test('Cloudflare function is stateless proxy only',()=>{assert.match(proxy,/pathname==='\/api\/proxy'/);assert.match(proxy,/pathname==='\/api\/health'/);assert.match(proxy,/persistence:false/);assert.doesNotMatch(proxy,/SUPABASE|D1Database|R2Bucket|KVNamespace|writeJSONStore/i);assert.doesNotMatch(activeWrangler,/SUPABASE|PROVIDER_SECRET_KEY|D1|R2|KV|CANVAS_OWNER/i)});
          test('stateful Cloudflare server and persistence migrations are removed',()=>{assert.equal(fs.existsSync(path.join(ROOT,'dist/server')),false);assert.equal(fs.existsSync(path.join(ROOT,'supabase')),false);assert.equal(fs.existsSync(path.join(ROOT,'functions/media')),false)});
          test('browser provider flow uses direct request then stateless proxy fallback',()=>{assert.match(runtime,/return await rawFetch\(url,\{\.\.\.init,mode:'cors'/);assert.match(runtime,/return proxyFetch\(url,init\)/);assert.match(runtime,/authCandidates/);assert.match(runtime,/\/v1\/models/);assert.match(runtime,/classifyAsyncPoll/)})
          ''',encoding='utf-8')
          PY
          rm -f .github/workflows/apply-browser-local-runtime-v1.yml .github/workflows/apply-browser-local-runtime-v2.yml
      - name: Validate browser-local preview
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make Cloudflare preview stateless and keep data in browser"
          git pull --rebase origin feature/browser-local-runtime
          git push origin HEAD:feature/browser-local-runtime
