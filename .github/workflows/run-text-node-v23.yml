name: Run UI 2.3 Text Node Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '.github/workflows/run-text-node-v23.yml'
      - '_read_123_zip_20260821_180410/scripts/implement-text-node-v23.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply text node migration
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/implement-text-node-v23.py
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit text node implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Match LibTV text node and lock composer size'
          git push origin HEAD:security/video-worker-hardening-20260825
