name: Apply Script Workflow V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Script Workflow V1 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Script Workflow V1 patch
        run: python scripts/apply-script-workflow-v1.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Regression tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement Script Workflow V1 foundation"
          git push origin HEAD:main
