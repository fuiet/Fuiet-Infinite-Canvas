name: Regression Image Generator V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regression-image-generator-v3.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: node --check image-generator-v2.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: _read_123_zip_20260821_180410
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/canvas-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep .5; done
      - name: Browser regression
        run: |
          cat > regression.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});

          async function freshPage(){
            const context=await browser.newContext({viewport:{width:1365,height:768}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e.message)));
            await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1100);
            const viewport=page.locator('#canvasViewport');
            const vr=await viewport.boundingBox();
            if(!vr) throw new Error('canvas missing');
            async function addNode(type,x,y){
              await page.mouse.dblclick(vr.x+x,vr.y+y,{delay:75});
              await page.waitForTimeout(150);
              const row=page.locator(`#contextMenu .libtv-add-row[data-kind="node"][data-id="${type}"]`).first();
              await row.waitFor({state:'visible',timeout:2500});
              await row.click();
              await page.waitForTimeout(260);
              return page.locator(`.node[data-node-type="${type}"]`).last();
            }
            return {context,page,errors,viewport,vr,addNode};
          }

          // 1) Image generator itself: complete, visible, model/settings/presets functional.
          {
            const {context,page,errors,addNode}=await freshPage();
            const image=await addNode('image',470,190);
            if(!(await image.count())) throw new Error('image node missing');
            const gen=page.locator('#generatorPanel.image-generator.image-generator-v2:not(.hidden)');
            await gen.waitFor({state:'visible',timeout:2500});
            if(await page.locator('#generatorPanel [data-image-preset-cat]').count()!==4) throw new Error('4 preset groups missing');
            if(!(await page.locator('#generatorPanel #modelPickerBtn').count())) throw new Error('model picker missing');
            if(!(await page.locator('#generatorPanel #imageSettingsSummary').count())) throw new Error('settings summary missing');
            const gr=await gen.boundingBox();
            console.log('GENERATOR_RECT',JSON.stringify(gr));
            if(!gr||gr.x<0||gr.y<0||gr.x+gr.width>1365||gr.y+gr.height>768) throw new Error('generator clipped');

            const settingsBtn=page.locator('#imageSettingsSummary');
            await settingsBtn.click();
            const settings=page.locator('.image-settings-popover');
            await settings.waitFor({state:'visible'});
            for(const label of ['画质','清晰度','比例','生成数量']){
              if(!(await settings.getByText(label,{exact:true}).count())) throw new Error(`settings missing ${label}`);
            }
            const ratioButton=settings.locator('[data-ratio-value]').nth(1);
            if(await ratioButton.count()){
              const value=await ratioButton.getAttribute('data-ratio-value');
              await ratioButton.click();
              await page.waitForTimeout(80);
              const actual=await page.locator('#generatorPanel #ratioSelect').inputValue();
              if(actual!==value) throw new Error(`ratio sync failed ${actual} != ${value}`);
            }
            await settingsBtn.click();
            await page.waitForTimeout(80);
            if(await page.locator('.image-settings-popover').count()) throw new Error('settings toggle did not close');

            const storyBtn=page.locator('#generatorPanel [data-image-preset-cat="story"]');
            await storyBtn.click();
            const presetPop=page.locator('.image-preset-popover');
            await presetPop.waitFor({state:'visible'});
            await presetPop.locator('[data-preset-index="0"]').click();
            await page.waitForTimeout(100);
            const prompt=await page.locator('#generatorPanel #promptInput').inputValue();
            if(!prompt.includes('建立镜头')) throw new Error('preset prompt not applied');

            await page.locator('#generatorPanel #modelPickerBtn').click();
            await page.waitForTimeout(120);
            if(!(await page.locator('#modelPicker:not(.hidden)').count())) throw new Error('existing model picker no longer opens');
            if(errors.length) throw new Error('image page errors: '+errors.join('\n'));
            await context.close();
          }

          // 2) Previously fixed manual-text double click must still work in a clean page.
          {
            const {context,page,errors,addNode}=await freshPage();
            await addNode('text',470,220);
            const manual=page.locator('.node[data-node-type="text"] [data-text-quick="manual"]').last();
            if(await manual.count()){await manual.click();await page.waitForTimeout(200)}
            const surface=page.locator('.node[data-node-type="text"] [data-text-manual-view]').last();
            const sr=await surface.boundingBox();
            if(!sr) throw new Error('manual text surface missing');
            await page.mouse.dblclick(sr.x+sr.width/2,sr.y+Math.min(85,sr.height/2),{delay:90});
            await page.waitForTimeout(200);
            const editor=page.locator('.node[data-node-type="text"] [data-text-manual][contenteditable="true"]').last();
            if(!(await editor.count())) throw new Error('text double-click regression');
            const focused=await editor.evaluate(el=>document.activeElement===el);
            if(!focused) throw new Error('manual text editor not focused');
            await page.keyboard.type('回归测试');
            await page.keyboard.press('Escape');
            await page.waitForTimeout(140);
            const preview=page.locator('.node[data-node-type="text"] [data-text-result]').last();
            if(!(await preview.innerText()).includes('回归测试')) throw new Error('manual text save regression');
            if(errors.length) throw new Error('text page errors: '+errors.join('\n'));
            await context.close();
          }

          // 3) Previously fixed connection paths must still work in a clean page.
          {
            const {context,page,errors,viewport,vr,addNode}=await freshPage();
            await addNode('text',320,190);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(100);
            await addNode('image',860,190);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(140);

            const textOut=page.locator('.node[data-node-type="text"] .node-port.out').last();
            const imageIn=page.locator('.node[data-node-type="image"] .node-port.in').last();
            const tor=await textOut.boundingBox(),iir=await imageIn.boundingBox();
            if(!tor||!iir) throw new Error('connection ports missing');
            const pathsBefore=await page.locator('#edgeLayer path').count();
            await page.mouse.move(tor.x+tor.width/2,tor.y+tor.height/2);
            await page.mouse.down();
            await page.mouse.move(iir.x+iir.width/2,iir.y+iir.height/2,{steps:10});
            await page.mouse.up();
            await page.waitForTimeout(180);
            const pathsAfter=await page.locator('#edgeLayer path').count();
            console.log('EDGE_PATHS',pathsBefore,pathsAfter);
            if(pathsAfter<=pathsBefore) throw new Error('node-to-node connection regression');

            const imageOut=page.locator('.node[data-node-type="image"] .node-port.out').last();
            const ior=await imageOut.boundingBox();
            if(!ior) throw new Error('blank-drop port missing');
            await page.mouse.move(ior.x+ior.width/2,ior.y+ior.height/2);
            await page.mouse.down();
            await page.mouse.move(vr.x+1110,vr.y+610,{steps:10});
            await page.mouse.up();
            await page.waitForTimeout(240);
            const connecting=await viewport.evaluate(el=>el.classList.contains('connecting-mode'));
            const quickAdd=page.locator('#contextMenu.libtv-add-menu:not(.hidden)');
            console.log('BLANK_DROP',JSON.stringify({connecting,quickAdd:await quickAdd.count()}));
            if(connecting) throw new Error('blank release stuck in connecting-mode');
            if(!(await quickAdd.count())) throw new Error('blank release add-node menu missing');
            if(errors.length) throw new Error('connection page errors: '+errors.join('\n'));
            await context.close();
          }

          await browser.close();
          JS
          node regression.mjs
