name: UI 2.3 Native Render Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '_read_123_zip_20260821_180410/scripts/retire-ui23-state-decorators.mjs'
      - '.github/workflows/ui23-native-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retire duplicate UI 2.3 decorators
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/retire-ui23-state-decorators.mjs
      - name: Validate native UI 2.3 runtime
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check app.js
          node --check ui-v23.js
          node --check ui-result-v23.js
          npm test
      - name: Commit compatibility retirement
        run: |
          if git diff --quiet -- _read_123_zip_20260821_180410/ui-v23.js _read_123_zip_20260821_180410/ui-result-v23.js; then
            echo 'No compatibility changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/ui-v23.js _read_123_zip_20260821_180410/ui-result-v23.js
          git commit -m 'Prefer native UI 2.3 node state'
          git push origin HEAD:security/video-worker-hardening-20260825
