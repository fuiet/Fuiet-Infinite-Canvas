name: Force Image Runtime Cache Bust

on:
  push:
    branches: [force-image-cache-bust]
    paths:
      - '.github/workflows/force-image-cache-bust.yml'

permissions:
  contents: write

jobs:
  cache-bust-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _read_123_zip_20260821_180410
    steps:
      - uses: actions/checkout@v4
        with:
          ref: force-image-cache-bust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Force entry resource versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          replacements = {
              './image-request-parameters.js?v=20260828-image-dimensions-1': './image-request-parameters.js?v=20260828-image-parameter-authority-2',
              './browser-runtime.js?v=20260828-video-runtime-1': './browser-runtime.js?v=20260828-image-parameter-authority-2',
              './browser-bootstrap.js?v=20260828-video-runtime-1': './browser-bootstrap.js?v=20260828-image-parameter-authority-2',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing index cache marker: {old}')
              text = text.replace(old, new)
          idx.write_text(text, encoding='utf-8')

          boot = Path('browser-bootstrap.js')
          text = boot.read_text(encoding='utf-8')
          old = "const v='20260828-image-parameter-authority-1';"
          new = "const v='20260828-image-parameter-authority-2';"
          if old not in text:
              raise SystemExit('missing bootstrap cache marker')
          boot.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm run check
          npm test
      - name: Commit cache-busted deployment
        shell: bash
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/index.html _read_123_zip_20260821_180410/browser-bootstrap.js
          git rm .github/workflows/force-image-cache-bust.yml
          git commit -m "Force fresh image parameter runtime deployment"
          git push origin HEAD:force-image-cache-bust
