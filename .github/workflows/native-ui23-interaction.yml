name: Native UI 2.3 Interaction Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '_read_123_zip_20260821_180410/scripts/native-ui23-interaction.mjs'
      - '.github/workflows/native-ui23-interaction.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move four-state interaction ownership into app.js
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/native-ui23-interaction.mjs
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit migration
        run: |
          if git diff --quiet -- _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/ui-v23.js _read_123_zip_20260821_180410/tests/ui-design-system.test.mjs; then
            echo 'No migration changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/ui-v23.js _read_123_zip_20260821_180410/tests/ui-design-system.test.mjs
          git commit -m 'Native UI 2.3 composer and toolbar interaction'
          git push origin HEAD:security/video-worker-hardening-20260825
