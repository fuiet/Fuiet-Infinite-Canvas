name: Restore Cloudflare Preview V1

on:
  push:
    branches:
      - restore/cloudflare-preview-20260828
    paths:
      - '.github/workflows/restore-cloudflare-preview-v1.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Cloudflare deployment layer from last hosted baseline
        run: |
          git fetch origin fix/hosted-single-user-no-auth
          git checkout origin/fix/hosted-single-user-no-auth -- \
            _read_123_zip_20260821_180410/dist/server \
            _read_123_zip_20260821_180410/functions \
            _read_123_zip_20260821_180410/wrangler.toml \
            _read_123_zip_20260821_180410/tests/hosted-single-user-no-auth.test.mjs \
            _read_123_zip_20260821_180410/tests/provider-runtime-parity.test.mjs \
            _read_123_zip_20260821_180410/tests/worker-security.test.mjs \
            _read_123_zip_20260821_180410/tests/worker-task-recovery.test.mjs

          rm -f \
            _read_123_zip_20260821_180410/web-start.cjs \
            _read_123_zip_20260821_180410/Dockerfile \
            _read_123_zip_20260821_180410/.dockerignore \
            _read_123_zip_20260821_180410/docker-compose.yml \
            _read_123_zip_20260821_180410/WEB_PREVIEW.md \
            _read_123_zip_20260821_180410/tests/web-preview-runtime.test.mjs

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('_read_123_zip_20260821_180410')
          pkg = {
            'name': 'fuiet-infinite-canvas-cloudflare',
            'version': '4.4.0',
            'private': True,
            'description': 'Fuiet Infinite Canvas Cloudflare 在线开发预览版：Pages Functions + Worker provider gateway，GitHub main 自动部署。',
            'scripts': {
              'start': 'node server.js',
              'start:local': 'node server.js',
              'check': 'node --check app.js && node --check provider-adapter-contract.js && node --check provider-runtime-core.js && node --check server.js && node --check store.js && node --check models.js && node --check three-runtime.js && node --check ui-zh.js && node --check ui-v23.js && node --check ui-connect-v23.js && node --check dist/server/secure-index.js && node --check dist/server/secure-entry.js && node --check dist/server/production-entry.js && node --check dist/server/provider-compat-entry.js && node --check dist/server/reference-guard-entry.js && node --check dist/server/final-entry.js && node --check dist/server/auth-entry.js && node --check dist/server/pages-entry.js',
              'test': 'node --test tests/*.test.mjs'
            },
            'engines': {'node': '>=22'}
          }
          (root / 'package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          wrangler = root / 'wrangler.toml'
          text = wrangler.read_text(encoding='utf-8')
          text = text.replace('compatibility_date = "2026-08-25"', 'compatibility_date = "2026-08-28"')
          wrangler.write_text(text, encoding='utf-8')
          PY

          # The previous conversion workflow is no longer authoritative.
          rm -f .github/workflows/convert-web-preview-v1.yml

      - name: Validate restored Cloudflare runtime
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test

      - name: Commit restored Cloudflare runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore Cloudflare online preview deployment"
          git pull --rebase origin restore/cloudflare-preview-20260828
          git push origin HEAD:restore/cloudflare-preview-20260828
