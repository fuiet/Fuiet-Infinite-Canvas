name: Fix Blank Drop Use Add Node Window

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blank-drop-use-add-node-window.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse existing add-node window for blank connection drops
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_read_123_zip_20260821_180410/app.js')
          s = path.read_text(encoding='utf-8')
          old = "requestAnimationFrame(()=>showCommandPalette(clientX,clientY,dropPoint,{fromNodeId:from}));"
          new = "requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from));"
          if old not in s:
              raise SystemExit('blank-drop command palette call not found')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: node --check _read_123_zip_20260821_180410/app.js

      - name: Verify blank-drop add-node window
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('_read_123_zip_20260821_180410/app.js').read_text(encoding='utf-8')
          assert 'cleanupConnectionDrag(false);' in s
          assert 'requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from));' in s
          assert 'requestAnimationFrame(()=>showCommandPalette(clientX,clientY,dropPoint,{fromNodeId:from}));' not in s
          PY
          git diff --check

      - name: Commit production change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/app.js
          git commit -m "Reuse add-node window for blank connection drops"
          git push origin main
