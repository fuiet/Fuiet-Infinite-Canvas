name: Run Video Node UI 2.3 Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '.github/workflows/run-video-node-v23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/video-worker-hardening-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply video node migration
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/implement-video-node-v23.py
      - name: Validate JavaScript syntax
        working-directory: _read_123_zip_20260821_180410
        run: node --check app.js
      - name: Validate app checks
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Validate existing tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Validate video node contract
        working-directory: _read_123_zip_20260821_180410
        run: node tests/video-node-v23.test.mjs
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit video node implementation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js \
                  _read_123_zip_20260821_180410/index.html \
                  _read_123_zip_20260821_180410/tests/ui-design-system.test.mjs
          git commit -m 'Apply UI 2.3 video node behavior'
          git push origin HEAD:security/video-worker-hardening-20260825
