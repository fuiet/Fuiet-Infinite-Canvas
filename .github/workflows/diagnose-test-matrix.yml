name: Diagnose test matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-test-matrix.yml'

jobs:
  subtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: text-style-layer, file: text-node-v23.test.mjs, pattern: 'text node stylesheet' }
          - { id: text-empty-actions, file: text-node-v23.test.mjs, pattern: 'text node empty state' }
          - { id: text-rich-editor, file: text-node-v23.test.mjs, pattern: 'manual writing switches' }
          - { id: text-transforms, file: text-node-v23.test.mjs, pattern: 'selected text results' }
          - { id: text-branch, file: text-node-v23.test.mjs, pattern: 'text result transforms' }
          - { id: text-translate, file: text-node-v23.test.mjs, pattern: 'translation asks' }
          - { id: text-composer, file: text-node-v23.test.mjs, pattern: 'text composer stays' }
          - { id: text-exclusive, file: text-node-v23.test.mjs, pattern: 'composer and contextual' }
          - { id: text-stability, file: text-node-v23.test.mjs, pattern: 'text nodes remain stable' }
          - { id: text-manual-dblclick, file: text-node-v23.test.mjs, pattern: 'manual text mode shows' }
          - { id: ui-stack, file: ui-design-system.test.mjs, pattern: 'canvas loads the UI' }
          - { id: ui-assets, file: ui-design-system.test.mjs, pattern: 'keeps assets in the bottom-left' }
          - { id: ui-four-state, file: ui-design-system.test.mjs, pattern: 'universal four-state' }
          - { id: ui-result-composer, file: ui-design-system.test.mjs, pattern: 'result nodes use context toolbar' }
          - { id: ui-toolbar, file: ui-design-system.test.mjs, pattern: 'result context toolbar' }
          - { id: ui-image-width, file: ui-design-system.test.mjs, pattern: 'result selection no longer' }
          - { id: ui-asset-tabs, file: ui-design-system.test.mjs, pattern: 'asset manager implements' }
          - { id: ui-connect, file: ui-design-system.test.mjs, pattern: 'bottom dock exposes' }
          - { id: ui-progress, file: ui-design-system.test.mjs, pattern: 'generation progress is native' }
          - { id: ui-result-shell, file: ui-design-system.test.mjs, pattern: 'result-first shell' }
          - { id: ui-runtime-scope, file: ui-design-system.test.mjs, pattern: 'ui-v23 is limited' }
          - { id: ui-action-bindings, file: ui-design-system.test.mjs, pattern: 'native result toolbar binds' }
          - { id: ui-legacy, file: ui-design-system.test.mjs, pattern: 'legacy scaffold no longer' }
    name: diag ${{ matrix.id }}
    defaults:
      run:
        working-directory: _read_123_zip_20260821_180410
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-name-pattern="${{ matrix.pattern }}" tests/${{ matrix.file }}
