name: Patch XOGPU strict request

on:
  push:
    paths:
      - '_patch_xogpu_strict_request.py'
      - '.github/workflows/patch-xogpu-strict-request.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 _patch_xogpu_strict_request.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+fuiet@users.noreply.github.com
          git add _read_123_zip_20260821_180410
          git diff --cached --quiet || (git commit -m "Force strict XOGPU MiniMax-H3 request body" && git push)
