name: Patch remote output persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-remote-output-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply persistence patch
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/patch-remote-output-persistence.py
      - name: Verify syntax and tests
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/server.js _read_123_zip_20260821_180410/tests/remote-output-persistence.test.mjs
          git commit -m "Persist authenticated provider outputs safely"
          git push
