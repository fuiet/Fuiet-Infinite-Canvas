name: Upgrade IndexedDB Persistence V1

on:
  push:
    branches:
      - feature/indexeddb-persistence
    paths:
      - '.github/workflows/upgrade-indexeddb-persistence-v1.yml'
      - '.github/scripts/upgrade_indexeddb_persistence.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply IndexedDB migration
        run: python .github/scripts/upgrade_indexeddb_persistence.py

      - name: Validate IndexedDB runtime
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test

      - name: Commit IndexedDB migration
        run: |
          rm -f .github/workflows/upgrade-indexeddb-persistence-v1.yml
          rm -f .github/scripts/upgrade_indexeddb_persistence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade browser persistence to IndexedDB"
          git pull --rebase origin feature/indexeddb-persistence
          git push origin HEAD:feature/indexeddb-persistence
