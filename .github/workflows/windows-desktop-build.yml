name: Build Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - '_read_123_zip_20260821_180410/electron-main.cjs'
      - '_read_123_zip_20260821_180410/server.js'
      - '_read_123_zip_20260821_180410/package.json'
      - '_read_123_zip_20260821_180410/app.js'
      - '_read_123_zip_20260821_180410/models.js'
      - '_read_123_zip_20260821_180410/provider-adapter-contract.js'
      - '_read_123_zip_20260821_180410/provider-runtime-core.js'
      - '_read_123_zip_20260821_180410/scripts/fetch-windows-media-tools.ps1'
      - '_read_123_zip_20260821_180410/tests/bundled-media-tools.test.mjs'
      - '.github/workflows/windows-desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: _read_123_zip_20260821_180410
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Prepare bundled FFmpeg and ImageMagick
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-windows-media-tools.ps1

      - name: Verify prepared media tools
        shell: powershell
        run: |
          & .\runtime-tools\ffmpeg\bin\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime-tools\ffmpeg\bin\ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime-tools\imagemagick\magick.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Verify packaged media tools
        shell: powershell
        run: |
          $root = '.\release\win-unpacked\resources\tools'
          $required = @(
            "$root\ffmpeg\bin\ffmpeg.exe",
            "$root\ffmpeg\bin\ffprobe.exe",
            "$root\imagemagick\magick.exe",
            "$root\tool-manifest.json",
            "$root\THIRD_PARTY_NOTICES.txt"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Packaged runtime is missing: $file" }
          }
          & "$root\ffmpeg\bin\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root\ffmpeg\bin\ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MAGICK_HOME = (Resolve-Path "$root\imagemagick").Path
          & "$root\imagemagick\magick.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add portable preview instructions
        shell: powershell
        run: |
          @"
          Fuiet Infinite Canvas - Windows x64 Portable Preview

          This build does not need installation.
          1. Extract the entire downloaded artifact.
          2. Keep all files and folders together.
          3. Double-click the Fuiet Infinite Canvas executable in this folder.

          FFmpeg, FFprobe and ImageMagick are bundled under resources/tools.
          No system Node.js, FFmpeg, FFprobe or ImageMagick installation is required.
          "@ | Set-Content '.\release\win-unpacked\README-PORTABLE.txt' -Encoding UTF8

      - name: Upload no-install Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Fuiet-Infinite-Canvas-Windows-x64-Portable-Preview
          path: _read_123_zip_20260821_180410/release/win-unpacked/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fuiet-Infinite-Canvas-Windows-x64
          path: _read_123_zip_20260821_180410/release/*.exe
          if-no-files-found: error
          retention-days: 30
