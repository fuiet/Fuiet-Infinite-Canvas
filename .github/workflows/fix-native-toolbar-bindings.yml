name: Fix Native Toolbar Bindings

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '_read_123_zip_20260821_180410/scripts/fix-native-toolbar-bindings.mjs'
      - '.github/workflows/fix-native-toolbar-bindings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix toolbar bindings
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/fix-native-toolbar-bindings.mjs
      - name: Normalize toolbar binding regression test
        working-directory: _read_123_zip_20260821_180410
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ui-design-system.test.mjs')
          s = p.read_text()
          marker = "\ntest('native result toolbar binds every generated action'"
          start = s.find(marker)
          if start != -1:
              s = s[:start]
          s += """


test('native result toolbar binds every generated action', () => {
  const app = read('app.js');
  assert.ok(app.includes("$$('[data-multi-top]',toolbar).forEach"));
  assert.ok(app.includes("$$('[data-top-action]',toolbar).forEach"));
});
"""
          p.write_text(s)
          PY
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/tests/ui-design-system.test.mjs
          git commit -m 'Fix native UI 2.3 toolbar action bindings'
          git push origin HEAD:security/video-worker-hardening-20260825
