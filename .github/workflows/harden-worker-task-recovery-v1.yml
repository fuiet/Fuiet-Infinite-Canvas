name: Harden Worker Task Recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harden-worker-task-recovery-v1.yml'
      - '_read_123_zip_20260821_180410/scripts/harden-worker-task-recovery-v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Worker persisted task recovery
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/harden-worker-task-recovery-v1.py
      - name: Validate Worker syntax
        working-directory: _read_123_zip_20260821_180410
        run: node --check dist/server/secure-index.js
      - name: Run recovery regression
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/worker-task-recovery.test.mjs
      - name: Run full checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit Worker recovery hardening
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/tests/worker-task-recovery.test.mjs
          git add -f _read_123_zip_20260821_180410/dist/server/secure-index.js
          git commit -m 'Recover persisted Worker tasks without duplicate submits'
          git push origin HEAD:main
