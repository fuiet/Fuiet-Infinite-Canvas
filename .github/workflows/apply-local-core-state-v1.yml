name: Apply Local Core State V1

on:
  push:
    branches: [local-core-refactor-v1]
    paths:
      - 'scripts/apply-local-core-state-v1.py'
      - '.github/workflows/apply-local-core-state-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-core-refactor-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply precise server lifecycle patch
        run: python scripts/apply-local-core-state-v1.py

      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check

      - name: Regression tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test

      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/server.js
          if git diff --cached --quiet; then
            echo 'No server lifecycle changes to commit.'
            exit 0
          fi
          git commit -m 'Make provider video success irreversible'
          git push origin HEAD:local-core-refactor-v1
