name: Apply video protocol registry v5

on:
  push:
    branches: [video-protocol-registry-v5]
    paths:
      - '.github/workflows/apply-video-protocol-registry-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-protocol-registry-v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize legacy models cache marker
        working-directory: _read_123_zip_20260821_180410
        run: sed -i 's/provider-adapter-contract.js?v=20260828-video-runtime-1/provider-adapter-contract.js?v=20260828-video-error-reporting-1/' models.html
      - name: Apply registry patch
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/apply-video-protocol-registry-v5.cjs
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement model-family video protocol registry"
          git push origin HEAD:video-protocol-registry-v5
