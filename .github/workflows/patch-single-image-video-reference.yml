name: Patch single image video reference
on:
  push:
    paths:
      - 'scripts/patch-single-image-video-reference.py'
      - '.github/workflows/patch-single-image-video-reference.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-single-image-video-reference.py
      - name: Syntax check
        run: npm run check --prefix _read_123_zip_20260821_180410
      - name: Upstream reference tests
        run: node --test _read_123_zip_20260821_180410/tests/upstream-generation-inputs.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add _read_123_zip_20260821_180410/upstream-generation-inputs-v1.js _read_123_zip_20260821_180410/tests/upstream-generation-inputs.test.mjs _read_123_zip_20260821_180410/browser-bootstrap.js _read_123_zip_20260821_180410/index.html
          git commit -m 'Use single image as video first frame'
          git push
