name: Fix Cloudflare Secret Env V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-cloudflare-secret-env-v1.py'
      - '.github/workflows/fix-cloudflare-secret-env-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply env preservation patch
        run: python scripts/fix-cloudflare-secret-env-v1.py

      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: node --check dist/server/auth-entry.js

      - name: Focused regression test
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/cloudflare-secret-env-preservation.test.mjs

      - name: Full test suite
        working-directory: _read_123_zip_20260821_180410
        run: npm test

      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _read_123_zip_20260821_180410/dist/server/auth-entry.js
          git add _read_123_zip_20260821_180410/tests/cloudflare-secret-env-preservation.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Preserve Cloudflare secret bindings in hosted env"
          git push origin main
