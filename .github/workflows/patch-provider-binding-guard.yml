name: Patch provider binding guard
on:
  push:
    paths:
      - 'scripts/patch-provider-binding-guard.py'
      - '.github/workflows/patch-provider-binding-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-provider-binding-guard.py
      - name: Syntax check
        run: npm run check --prefix _read_123_zip_20260821_180410
      - name: Focused ownership tests
        run: node _read_123_zip_20260821_180410/tests/provider-binding-guard.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add _read_123_zip_20260821_180410/provider-adapter-contract.js _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/index.html _read_123_zip_20260821_180410/tests/provider-binding-guard.test.mjs
          git commit -m 'Guard node models by provider ownership'
          git push
      - name: Remove temporary patch files
        run: |
          git pull --rebase
          git rm scripts/patch-provider-binding-guard.py .github/workflows/patch-provider-binding-guard.yml
          git commit -m 'chore: remove temporary provider binding patch'
          git push
