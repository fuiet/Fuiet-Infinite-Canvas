name: Fix Blank Drop Shared Add UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blank-drop-shared-add-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve stable release and reuse full add-node UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_read_123_zip_20260821_180410/app.js')
          s = path.read_text(encoding='utf-8')

          old_sig = "function showQuickAdd(x,y,p,fromNodeId=null,{preferAboveToolbar=false}={}){"
          new_sig = "function showQuickAdd(x,y,p,fromNodeId=null,{preferAboveToolbar=false,fullMenu=false}={}){"
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          elif new_sig not in s:
              raise SystemExit('showQuickAdd signature not found')

          old_source = "const source=fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));"
          new_source = "const source=!fullMenu&&fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));"
          if old_source in s:
              s = s.replace(old_source, new_source, 1)
          elif new_source not in s:
              raise SystemExit('showQuickAdd source line not found')

          old_drop = "requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from));"
          new_drop = "requestAnimationFrame(()=>showQuickAdd(clientX,clientY,dropPoint,from,{fullMenu:true}));"
          if old_drop in s:
              s = s.replace(old_drop, new_drop, 1)
          elif new_drop not in s:
              raise SystemExit('blank-drop showQuickAdd call not found')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: node --check _read_123_zip_20260821_180410/app.js

      - name: Verify regression invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('_read_123_zip_20260821_180410/app.js').read_text(encoding='utf-8')
          assert "function showQuickAdd(x,y,p,fromNodeId=null,{preferAboveToolbar=false,fullMenu=false}={})" in s
          assert "const source=!fullMenu&&fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));" in s
          assert "cleanupConnectionDrag(false);" in s
          assert "showQuickAdd(clientX,clientY,dropPoint,from,{fullMenu:true})" in s
          assert "showCommandPalette(clientX,clientY,dropPoint,{fromNodeId:from})" not in s
          PY
          git diff --check

      - name: Commit production fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/app.js
          git commit -m "Separate blank-drop behavior from add-node UI"
          git push origin main
