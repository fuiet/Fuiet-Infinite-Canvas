services:
  canvas:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CANVAS_RUNTIME: web
      HOST: 0.0.0.0
      PORT: 8080
      CANVAS_DATA_DIR: /data
      CANVAS_TASK_CONCURRENCY: 2
      CANVAS_TRUST_PROXY: 0
    volumes:
      - ./.data-web:/data
