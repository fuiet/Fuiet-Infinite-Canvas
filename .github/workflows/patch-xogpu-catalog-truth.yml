name: Patch XOGPU catalog truth

on:
  push:
    paths:
      - '_patch_xogpu_catalog_truth.py'
      - '.github/workflows/patch-xogpu-catalog-truth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 _patch_xogpu_catalog_truth.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+fuiet@users.noreply.github.com
          git add _read_123_zip_20260821_180410
          git diff --cached --quiet || (git commit -m "Trust XOGPU catalog for MiniMax-H3 availability" && git push)
