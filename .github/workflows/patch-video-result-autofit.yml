name: Patch video result autofit

on:
  push:
    paths:
      - '_patch_video_result_autofit.py'
      - '.github/workflows/patch-video-result-autofit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 _patch_video_result_autofit.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _read_123_zip_20260821_180410/styles/video-result-autofit-v1.css \
                  _read_123_zip_20260821_180410/browser-bootstrap.js \
                  _read_123_zip_20260821_180410/browser-runtime.js \
                  _read_123_zip_20260821_180410/index.html \
                  _read_123_zip_20260821_180410/models.html \
                  _read_123_zip_20260821_180410/tests
          git diff --cached --quiet || (git commit -m "Tighten video result header spacing" && git push)
