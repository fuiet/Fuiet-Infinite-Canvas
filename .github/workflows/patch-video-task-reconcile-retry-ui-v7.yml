name: Patch video task reconcile retry UI v7

on:
  push:
    branches: [video-task-reconcile-retry-ui-v7]
    paths:
      - '.github/workflows/patch-video-task-reconcile-retry-ui-v7.yml'
      - '_read_123_zip_20260821_180410/scripts/patch-video-task-reconcile-retry-ui-v7.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-task-reconcile-retry-ui-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply task reconciliation fix
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/patch-video-task-reconcile-retry-ui-v7.cjs
      - name: Check and test
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Re-adopt provider-success video tasks after refresh"
          git push origin HEAD:video-task-reconcile-retry-ui-v7
