name: Patch XOGPU official contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xogpu-official-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-xogpu-official-contract.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Focused XOGPU tests
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/xogpu-minimax-h3.test.mjs tests/video-protocol-registry.test.mjs tests/video-reference-transport.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git rm .github/workflows/patch-xogpu-official-contract.yml scripts/patch-xogpu-official-contract.py
          git add _read_123_zip_20260821_180410/video-protocol-registry.js \
                  _read_123_zip_20260821_180410/provider-adapter-contract.js \
                  _read_123_zip_20260821_180410/browser-runtime-preview.js \
                  _read_123_zip_20260821_180410/browser-runtime.js \
                  _read_123_zip_20260821_180410/server.js \
                  _read_123_zip_20260821_180410/index.html \
                  _read_123_zip_20260821_180410/tests/xogpu-minimax-h3.test.mjs
          git add -u _read_123_zip_20260821_180410/tests/xogpu-create-path-fallback.test.mjs || true
          git diff --cached --quiet && exit 0
          git commit -m 'Align XOGPU MiniMax-H3 with supplied API docs'
          git push origin main
