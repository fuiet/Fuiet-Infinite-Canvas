name: Add Electron Desktop V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-electron-desktop-v1.py'
      - '.github/workflows/add-electron-desktop-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply desktop packaging patch
        run: python scripts/add-electron-desktop-v1.py

      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check

      - name: Regression tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test

      - name: Commit desktop packaging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/server.js \
                  _read_123_zip_20260821_180410/electron-main.cjs \
                  _read_123_zip_20260821_180410/package.json \
                  _read_123_zip_20260821_180410/.gitignore \
                  _read_123_zip_20260821_180410/README.md \
                  _read_123_zip_20260821_180410/tests/desktop-packaging.test.mjs
          if git diff --cached --quiet; then
            echo 'No desktop changes to commit.'
            exit 0
          fi
          git commit -m 'Package local app as Windows Electron desktop installer'
          git push origin HEAD:main
