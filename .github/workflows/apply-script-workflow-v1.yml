name: Apply Script Workflow V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry Script Workflow V1 patch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix patcher function boundary detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-script-workflow-v1-v2.py')
          s=p.read_text(encoding='utf-8')
          old="""def replace_function(text,name,new_code):
              marker=f'  function {name}('
              start=text.find(marker)
              if start<0:
                  raise SystemExit(f'missing function: {name}')
              nxt=text.find('\\n  function ',start+len(marker))
              if nxt<0:
                  raise SystemExit(f'missing next function after: {name}')
              return text[:start]+new_code.rstrip()+text[nxt:]
          """
          new="""def replace_function(text,name,new_code):
              markers=[f'  function {name}(',f'  async function {name}(']
              found=[(text.find(m),m) for m in markers if text.find(m)>=0]
              if not found:
                  raise SystemExit(f'missing function: {name}')
              start,marker=min(found,key=lambda x:x[0])
              candidates=[x for x in (text.find('\\n  function ',start+len(marker)),text.find('\\n  async function ',start+len(marker))) if x>=0]
              if not candidates:
                  raise SystemExit(f'missing next function after: {name}')
              nxt=min(candidates)
              return text[:start]+new_code.rstrip()+text[nxt:]
          """
          if old not in s:
              raise SystemExit('patcher boundary function text changed')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply Script Workflow V1 patch
        run: python scripts/apply-script-workflow-v1-v2.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Regression tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement Script Workflow V1 foundation"
          git push origin HEAD:main
