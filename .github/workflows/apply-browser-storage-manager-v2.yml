name: Apply Browser Storage Manager V2

on:
  push:
    branches:
      - feature/browser-storage-manager
    paths:
      - '.github/workflows/apply-browser-storage-manager-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Browser Storage Manager
        run: |
          python .github/scripts/apply_browser_storage_manager.py
          python .github/scripts/update_storage_manager_tests.py
      - name: Validate storage manager
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
          ! grep -RInE '\blocalStorage\b|\bsessionStorage\b' . \
            --include='*.js' --exclude='browser-runtime.js' --exclude='browser-storage-manager.js' --exclude='browser-media-sw.js' \
            --exclude-dir='tests' --exclude-dir='.frontend-design'
      - name: Commit migration
        run: |
          rm -f .github/workflows/apply-browser-storage-manager-v1.yml
          rm -f .github/workflows/apply-browser-storage-manager-v2.yml
          rm -f .github/workflows/audit-browser-storage-v1.yml
          rm -f .github/scripts/apply_browser_storage_manager.py
          rm -f .github/scripts/update_storage_manager_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unify browser persistence behind Storage Manager"
          git pull --rebase origin feature/browser-storage-manager
          git push origin HEAD:feature/browser-storage-manager

# Retry after tightening bootstrap-aware regression assertions.
