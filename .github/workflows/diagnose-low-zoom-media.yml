name: Diagnose low zoom media

on:
  push:
    paths:
      - '.github/workflows/diagnose-low-zoom-media.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate zoom-driven media visibility logic
        run: |
          echo '=== zoom/scale candidates in app.js ==='
          grep -nEi 'zoom|scale|transform|level.of.detail|lod|performance' _read_123_zip_20260821_180410/app.js | head -n 240 || true
          echo '=== media visibility candidates in js/css ==='
          grep -RniE 'display:[[:space:]]*none|visibility:[[:space:]]*hidden|opacity:[[:space:]]*0|node-media|node-content-img|video.*display|img.*display|content-visibility|contain-intrinsic' _read_123_zip_20260821_180410 --include='*.js' --include='*.css' | head -n 320 || true
          echo '=== numeric low zoom thresholds ==='
          grep -RniE '(zoom|scale).{0,80}(0\.[0-9]+|[0-9]+%)|(0\.[0-9]+).{0,80}(zoom|scale)' _read_123_zip_20260821_180410 --include='*.js' --include='*.css' | head -n 240 || true
