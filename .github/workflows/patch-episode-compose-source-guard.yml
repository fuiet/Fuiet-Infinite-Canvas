name: Patch episode composition source guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-episode-compose-source-guard.py'
      - '.github/workflows/patch-episode-compose-source-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-episode-compose-source-guard.py
      - name: Align revision guard regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_read_123_zip_20260821_180410/tests/script-episode-compose-revision.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="  assert.match(app,/if\\(!trimOnly&&n\\?\\.toolParams\\?\\.operation==='script_episode_compose'\\)refreshEpisodeComposeResultStaleness\\(n\\)/);"
          new="  assert.match(app,/if\\(!trimOnly&&n\\?\\.toolParams\\?\\.operation==='script_episode_compose'\\)\\{const guard=scriptEpisodeComposeSourceGuard\\(n\\)/);\n  assert.match(app,/if\\(!guard\\.ok\\)\\{markEpisodeComposeResultsStale\\(n,guard\\.reason\\);showToast\\(guard\\.reason\\)\\}else refreshEpisodeComposeResultStaleness\\(n\\)/);"
          if old not in s:
              raise SystemExit('legacy open-timeline revision assertion missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/tests/script-episode-compose-source-guard.test.mjs _read_123_zip_20260821_180410/tests/script-episode-compose-revision.test.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Guard episode composition against stale Shot sources'
            git push origin main
          fi
