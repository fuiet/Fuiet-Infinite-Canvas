name: Fix API Zero Config V3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-api-zero-config-v3.yml'
      - '_read_123_zip_20260821_180410/scripts/fix-api-zero-config-v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply API zero-config repair
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/fix-api-zero-config-v3.py
      - name: Validate syntax
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check server.js
          node --check app.js
          node --check models.js
          node --check provider-adapter-contract.js
      - name: Run focused API configuration tests
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --test tests/provider-save-auto-discovery.test.mjs
          node --test tests/provider-zero-config.test.mjs
          node --test tests/provider-adapter-v2.test.mjs
          node --test tests/video-zero-config-v2.test.mjs
      - name: Run full regression suite
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit API configuration repair
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/server.js \
                  _read_123_zip_20260821_180410/app.js \
                  _read_123_zip_20260821_180410/models.js \
                  _read_123_zip_20260821_180410/tests/provider-save-auto-discovery.test.mjs
          git commit -m 'Fix Base URL and API Key zero-config onboarding'
          git push origin HEAD:main
