name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _read_123_zip_20260821_180410
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Run tests
        id: node-tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test-output.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-output
          path: _read_123_zip_20260821_180410/node-test-output.log
          if-no-files-found: ignore
          retention-days: 3
