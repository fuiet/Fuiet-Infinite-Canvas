name: Patch provider model ownership
on:
  push:
    paths:
      - 'scripts/patch-provider-model-ownership.py'
      - '.github/workflows/patch-provider-model-ownership.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-provider-model-ownership.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Focused ownership tests
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --test tests/provider-model-ownership.test.mjs
          node --test tests/xogpu-minimax-h3.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add \
            _read_123_zip_20260821_180410/provider-adapter-contract.js \
            _read_123_zip_20260821_180410/index.html \
            _read_123_zip_20260821_180410/tests/provider-model-ownership.test.mjs
          git diff --cached --quiet || git commit -m 'Enforce provider model ownership'
          git push
      - name: Remove temporary patch files
        if: success()
        run: |
          git pull --rebase
          git rm -f scripts/patch-provider-model-ownership.py .github/workflows/patch-provider-model-ownership.yml
          git commit -m 'chore: remove temporary provider ownership patch' || true
          git push || true
