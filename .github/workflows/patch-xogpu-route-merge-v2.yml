name: Patch XOGPU route merge v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-xogpu-route-merge-v2.py'
      - '.github/workflows/patch-xogpu-route-merge-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply XOGPU route merge patch
        run: python scripts/patch-xogpu-route-merge-v2.py
      - name: Syntax check adapter and regression test
        run: |
          node --check _read_123_zip_20260821_180410/provider-adapter-contract.js
          node --check _read_123_zip_20260821_180410/tests/xogpu-route-merge-v2.test.mjs
      - name: Run focused XOGPU regressions
        run: |
          node --test \
            _read_123_zip_20260821_180410/tests/xogpu-route-merge-v2.test.mjs \
            _read_123_zip_20260821_180410/tests/xogpu-root-route-v1.test.mjs \
            _read_123_zip_20260821_180410/tests/xogpu-discount-studio-contract.test.mjs \
            _read_123_zip_20260821_180410/tests/xogpu-browser-strict-request.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit corrected XOGPU adapter merge
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            _read_123_zip_20260821_180410/provider-adapter-contract.js \
            _read_123_zip_20260821_180410/index.html \
            _read_123_zip_20260821_180410/tests/xogpu-route-merge-v2.test.mjs
          git commit -m 'Fix XOGPU adapter route merge override'
          git push
