name: Apply Video Result Reconciliation V4

on:
  push:
    branches:
      - video-result-reconciliation-v4
    paths:
      - '.github/workflows/apply-video-result-reconciliation-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-result-reconciliation-v4
          fetch-depth: 0
      - name: Apply reconciliation patch
        run: python scripts/patch-video-result-reconciliation-v4.py
      - name: Syntax check patched runtime
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-video-result-reconciliation-v4.py
          rm .github/workflows/apply-video-result-reconciliation-v4.yml
      - name: Commit reconciliation runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix browser video result reconciliation"
          git push origin HEAD:video-result-reconciliation-v4
