name: Video Error Reporting Repair

on:
  push:
    branches:
      - fix/video-error-reporting
    paths:
      - '_read_123_zip_20260821_180410/scripts/apply_video_error_reporting.py'
      - '.github/workflows/video-error-reporting.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-error-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply video error and proxy repair
        run: python3 _read_123_zip_20260821_180410/scripts/apply_video_error_reporting.py
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit validated product changes
        run: |
          rm -f _read_123_zip_20260821_180410/scripts/apply_video_error_reporting.py
          rm -f .github/workflows/video-error-reporting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Preserve video HTTP errors and diagnostics"
          git push origin HEAD:fix/video-error-reporting
