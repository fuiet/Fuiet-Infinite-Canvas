name = "fuiet-infinite-canvas"
compatibility_date = "2026-08-25"
pages_build_output_dir = "."

[vars]
SUPABASE_STORAGE_BUCKET = "canvas-media"
CANVAS_TASK_CONCURRENCY = "2"
CANVAS_ALLOW_PRIVATE_PROVIDER_HOSTS = "0"
CANVAS_MAX_UPLOAD_BYTES = "52428800"
CANVAS_LOGIN_ATTEMPTS_PER_10M = "10"

# Current deployment mode: one private operator, no login/registration, no owner
# isolation. All provider/project/task/media data belongs to this one deployment.
# If the site is later opened to other people, re-enable authentication or tenant
# isolation before sharing the URL.
CANVAS_SINGLE_USER_NO_AUTH = "1"
CANVAS_DESKTOP_SINGLE_USER = "0"
CANVAS_ENFORCE_OWNER = "0"
CANVAS_CLAIM_UNOWNED = "0"
CANVAS_ALLOW_UNAUTHENTICATED_OWNER = "0"
CANVAS_AUTO_SINGLE_SUPABASE_OWNER = "0"

# Configure these as Cloudflare Secrets / Variables; never commit real values:
# PROVIDER_SECRET_KEY          = a long random encryption key (required to protect provider API keys)
# SUPABASE_URL                 = your Supabase project URL (only needed for Supabase persistence/storage)
# SUPABASE_SERVICE_ROLE_KEY    = server only; never expose to browser code
# CANVAS_PUBLIC_BASE_URL       = https://fuiet-infinite-canvas.pages.dev
#
# CANVAS_ADMIN_PASSWORD and CANVAS_OWNER_ID are intentionally not required in the
# current single-user no-auth mode. Even if stale values remain in Cloudflare, the
# runtime ignores them while CANVAS_SINGLE_USER_NO_AUTH=1.
#
# CANVAS_DESKTOP_SINGLE_USER=1 is reserved for a genuinely local/packaged build.
# Do not use that desktop mode for the hosted site because it has a desktop-only
# provider-secret fallback.
