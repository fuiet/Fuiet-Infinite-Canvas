name: UI 2.3 Native Render Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '_read_123_zip_20260821_180410/scripts/migrate-ui23-native-render.mjs'
      - '.github/workflows/ui23-native-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply native UI 2.3 render migration
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/migrate-ui23-native-render.mjs
      - name: Validate migrated app
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check app.js
          npm test
      - name: Commit migrated app
        run: |
          if git diff --quiet -- _read_123_zip_20260821_180410/app.js; then
            echo 'No app.js changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js
          git commit -m 'Native UI 2.3 node render'
          git push origin HEAD:security/video-worker-hardening-20260825
