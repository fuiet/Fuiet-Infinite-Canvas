name: Convert To Local Standalone V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/convert-local-standalone-v1.py'
      - '.github/workflows/convert-local-standalone-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Convert to local standalone
        run: python scripts/convert-local-standalone-v1.py

      - name: Verify Cloudflare runtime code is gone
        shell: bash
        run: |
          test ! -e _read_123_zip_20260821_180410/wrangler.toml
          test ! -d _read_123_zip_20260821_180410/functions
          test ! -d _read_123_zip_20260821_180410/dist/server
          test ! -d _read_123_zip_20260821_180410/supabase
          ! grep -RniE 'PROVIDER_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|pages\.dev|workers\.dev|wrangler\.toml|cf-access-client-secret' \
            _read_123_zip_20260821_180410/server.js \
            _read_123_zip_20260821_180410/package.json \
            _read_123_zip_20260821_180410/app.js \
            _read_123_zip_20260821_180410/functions 2>/dev/null

      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check

      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test

      - name: Remove temporary converter
        run: rm -f scripts/convert-local-standalone-v1.py .github/workflows/convert-local-standalone-v1.yml

      - name: Commit local-only architecture
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Convert app to local standalone runtime'
          git push origin HEAD:main
