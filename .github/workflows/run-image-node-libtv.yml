name: Run LibTV Image Node Migration

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '.github/workflows/run-image-node-libtv.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply image node migration
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/implement-image-node-libtv.py
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
          node tests/image-node-libtv.test.mjs
      - name: Commit image node implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js _read_123_zip_20260821_180410/index.html _read_123_zip_20260821_180410/tests/image-node-libtv.test.mjs
          git commit -m 'Match LibTV image node and generator behavior'
          git push origin HEAD:security/video-worker-hardening-20260825
