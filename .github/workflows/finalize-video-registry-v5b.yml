name: Verify finalized video registry v5

on:
  push:
    branches: [video-protocol-registry-v5]
    paths:
      - '.github/workflows/finalize-video-registry-v5b.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-protocol-registry-v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize registry files
        working-directory: _read_123_zip_20260821_180410
        run: node scripts/finalize-video-registry-v5.cjs
      - name: Check and test
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit verified final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize model-family video protocol registry"
          git push origin HEAD:video-protocol-registry-v5
