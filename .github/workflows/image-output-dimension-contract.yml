name: Image Output Dimension Contract

on:
  push:
    branches:
      - fix/image-output-dimension-contract
    paths:
      - '_read_123_zip_20260821_180410/scripts/apply_image_output_dimension_contract.py'
      - '_read_123_zip_20260821_180410/image-output-dimensions.js'
      - '_read_123_zip_20260821_180410/tests/image-output-dimension-contract.test.mjs'
      - '.github/workflows/image-output-dimension-contract.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-output-dimension-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply image output dimension contract
        run: python3 _read_123_zip_20260821_180410/scripts/apply_image_output_dimension_contract.py
      - name: Validate
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit validated product changes
        run: |
          rm -f _read_123_zip_20260821_180410/scripts/apply_image_output_dimension_contract.py
          rm -f .github/workflows/image-output-dimension-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enforce selected image output dimensions"
          git push origin HEAD:fix/image-output-dimension-contract
