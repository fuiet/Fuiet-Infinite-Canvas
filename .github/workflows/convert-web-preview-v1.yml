name: Convert To Web Preview V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-web-preview-v1.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Convert desktop-first runtime to web-preview-first runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('_read_123_zip_20260821_180410')
          server_path = root / 'server.js'
          text = server_path.read_text(encoding='utf-8')

          old = """const ADMIN_PASSWORD = ''; // standalone: no login\nconst HOST = '127.0.0.1'; // standalone: never expose the local API to the LAN by default\nconst TRUST_PROXY = false;\nconst SESSION_TTL_MS = Math.max(60*60*1000, Number(process.env.CANVAS_SESSION_TTL_MS || 24*60*60*1000));\nconst ALLOW_CORS = false;\nconst FFMPEG_BIN = process.env.FFMPEG_PATH || 'ffmpeg';\nconst MAGICK_BIN = process.env.MAGICK_PATH || 'magick';\nconst FFPROBE_BIN = process.env.FFPROBE_PATH || 'ffprobe';\n"""
          new = """const RUNTIME_MODE = String(process.env.CANVAS_RUNTIME || 'local').trim().toLowerCase();\nconst IS_WEB_RUNTIME = RUNTIME_MODE === 'web' || RUNTIME_MODE === 'preview' || String(process.env.CANVAS_WEB_PREVIEW || '0') === '1';\nconst ADMIN_PASSWORD = IS_WEB_RUNTIME ? String(process.env.CANVAS_ADMIN_PASSWORD || '').trim() : ''; // optional for an internet-facing preview; local stays login-free\nconst HOST = IS_WEB_RUNTIME ? String(process.env.HOST || '0.0.0.0').trim() : '127.0.0.1';\nconst TRUST_PROXY = IS_WEB_RUNTIME && String(process.env.CANVAS_TRUST_PROXY || '0') === '1';\nconst SESSION_TTL_MS = Math.max(60*60*1000, Number(process.env.CANVAS_SESSION_TTL_MS || 24*60*60*1000));\nconst ALLOW_CORS = false;\nconst FFMPEG_BIN = process.env.FFMPEG_PATH || 'ffmpeg';\nconst MAGICK_BIN = process.env.MAGICK_PATH || (process.platform === 'win32' ? 'magick' : 'convert');\nconst FFPROBE_BIN = process.env.FFPROBE_PATH || 'ffprobe';\n"""
          if old not in text:
              raise SystemExit('server runtime constants block not found')
          text = text.replace(old, new, 1)

          old_health = "return json(res,200,{ok:true,service:'canvas-provider-gateway',taskConcurrency:TASK_CONCURRENCY,queuePaused:taskQueuePaused,authEnabled:Boolean(ADMIN_PASSWORD)})"
          new_health = "return json(res,200,{ok:true,service:'canvas-provider-gateway',runtime:IS_WEB_RUNTIME?'web':'local',taskConcurrency:TASK_CONCURRENCY,queuePaused:taskQueuePaused,authEnabled:Boolean(ADMIN_PASSWORD)})"
          if old_health not in text:
              raise SystemExit('health response not found')
          text = text.replace(old_health, new_health, 1)

          old_log = "console.log(`Canvas Studio running at http://${HOST}:${PORT}`);"
          new_log = "console.log(`Fuiet Infinite Canvas (${IS_WEB_RUNTIME?'web':'local'}) running at http://${HOST}:${PORT}`);"
          if old_log not in text:
              raise SystemExit('startup log not found')
          text = text.replace(old_log, new_log, 1)
          server_path.write_text(text, encoding='utf-8')

          pkg = {
            "name": "fuiet-infinite-canvas-web",
            "version": "4.3.0",
            "private": True,
            "description": "Fuiet Infinite Canvas 网页在线体验版：Node Web 服务、SQLite 持久化、服务端供应商密钥加密、任务队列与媒体处理。",
            "scripts": {
              "start": "node web-start.cjs",
              "start:web": "node web-start.cjs",
              "start:local": "node server.js",
              "check": "node --check app.js && node --check provider-adapter-contract.js && node --check provider-runtime-core.js && node --check server.js && node --check web-start.cjs && node --check store.js && node --check models.js && node --check three-runtime.js && node --check ui-zh.js && node --check ui-v23.js && node --check ui-connect-v23.js",
              "test": "node --test tests/*.test.mjs"
            },
            "engines": {"node": ">=22"}
          }
          (root/'package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (root/'web-start.cjs').write_text("""// Web preview entrypoint. Keeps server.js usable in local-only mode while making npm start internet-host friendly.\nprocess.env.CANVAS_RUNTIME = process.env.CANVAS_RUNTIME || 'web';\nprocess.env.HOST = process.env.HOST || '0.0.0.0';\nrequire('./server.js');\n""", encoding='utf-8')

          (root/'Dockerfile').write_text("""FROM node:24-bookworm-slim\n\nRUN apt-get update \\\n  && apt-get install -y --no-install-recommends ca-certificates ffmpeg imagemagick \\\n  && rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app\nCOPY . .\n\nENV NODE_ENV=production \\\n    CANVAS_RUNTIME=web \\\n    HOST=0.0.0.0 \\\n    PORT=8080 \\\n    CANVAS_DATA_DIR=/data \\\n    FFMPEG_PATH=/usr/bin/ffmpeg \\\n    FFPROBE_PATH=/usr/bin/ffprobe \\\n    MAGICK_PATH=/usr/bin/convert\n\nVOLUME [\"/data\"]\nEXPOSE 8080\n\nCMD [\"node\", \"web-start.cjs\"]\n""", encoding='utf-8')

          (root/'.dockerignore').write_text(""".git\n.github\n.data\nrelease\nruntime-tools\nnode_modules\n*.exe\n*.zip\n""", encoding='utf-8')

          (root/'docker-compose.yml').write_text("""services:\n  canvas:\n    build: .\n    restart: unless-stopped\n    ports:\n      - \"8080:8080\"\n    environment:\n      CANVAS_RUNTIME: web\n      HOST: 0.0.0.0\n      PORT: 8080\n      CANVAS_DATA_DIR: /data\n      CANVAS_TASK_CONCURRENCY: 2\n      CANVAS_TRUST_PROXY: 0\n    volumes:\n      - ./.data-web:/data\n""", encoding='utf-8')

          (root/'WEB_PREVIEW.md').write_text("""# Fuiet Infinite Canvas — Web Preview\n\n当前主版本是网页在线体验版，不再以 Windows EXE 为主要交付方式。\n\n## 运行方式\n\n### Node\n\n```bash\nnpm start\n```\n\n默认 Web 模式监听 `0.0.0.0:$PORT`（默认 8080）。\n\n### Docker\n\n```bash\ndocker compose up -d --build\n```\n\n打开 `http://服务器IP:8080`。生产环境建议由 Nginx/Caddy 反向代理到 8080 并启用 HTTPS。\n\n## 数据\n\n容器内数据目录为 `/data`，必须挂载持久卷。保存内容包括：\n\n- `providers.json`：供应商配置（API Key 为加密形式）\n- `secret.key`：供应商 API Key 本机/服务器加密主密钥\n- `canvas.sqlite`：项目、任务、版本等数据\n- `media/`：上传和生成的媒体文件\n\n**不要删除或更换已有 `secret.key`，否则旧的供应商 API Key 将无法解密。**\n\n## 在线体验安全\n\n默认仍然不强制登录，适合私人、不可猜测的预览地址。若地址会公开，可设置环境变量：\n\n```text\nCANVAS_ADMIN_PASSWORD=你自己的访问密码\nCANVAS_TRUST_PROXY=1   # 仅在可信反向代理后使用\n```\n\n供应商 API Key 不会返回给浏览器。\n\n## 媒体工具\n\nDocker 镜像直接安装 FFmpeg / FFprobe / ImageMagick，因此网页服务器可以继续执行现有媒体处理功能，不依赖访问者电脑安装任何工具。\n""", encoding='utf-8')

          test = root/'tests'/'web-preview-runtime.test.mjs'
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');\nconst server = fs.readFileSync(path.join(ROOT, 'server.js'), 'utf8');\nconst start = fs.readFileSync(path.join(ROOT, 'web-start.cjs'), 'utf8');\nconst dockerfile = fs.readFileSync(path.join(ROOT, 'Dockerfile'), 'utf8');\nconst pkg = JSON.parse(fs.readFileSync(path.join(ROOT, 'package.json'), 'utf8'));\n\ntest('web preview is the primary runtime while local mode remains loopback-only', () => {\n  assert.equal(pkg.name, 'fuiet-infinite-canvas-web');\n  assert.equal(pkg.scripts.start, 'node web-start.cjs');\n  assert.match(start, /CANVAS_RUNTIME[\\s\\S]*web/);\n  assert.match(server, /IS_WEB_RUNTIME[\\s\\S]*0\\.0\\.0\\.0/);\n  assert.match(server, /: '127\\.0\\.0\\.1'/);\n});\n\ntest('web container includes server-side media tooling and persistent data mount', () => {\n  assert.match(dockerfile, /ffmpeg imagemagick/);\n  assert.match(dockerfile, /FFPROBE_PATH=\\/usr\\/bin\\/ffprobe/);\n  assert.match(dockerfile, /MAGICK_PATH=\\/usr\\/bin\\/convert/);\n  assert.match(dockerfile, /CANVAS_DATA_DIR=\\/data/);\n  assert.match(dockerfile, /VOLUME \[\"\\/data\"\]/);\n});\n\ntest('desktop packaging is no longer part of the primary package', () => {\n  assert.equal(pkg.main, undefined);\n  assert.equal(pkg.build, undefined);\n  assert.equal(pkg.devDependencies, undefined);\n  assert.equal(pkg.scripts.desktop, undefined);\n  assert.equal(pkg.scripts['dist:win'], undefined);\n});\n""", encoding='utf-8')

          win = Path('.github/workflows/windows-desktop-build.yml')
          if win.exists():
              win.unlink()
          PY

      - name: Validate web preview runtime
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
          docker build -t fuiet-infinite-canvas-web-preview .

      - name: Commit converted web preview runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Make web preview the primary runtime"
          git pull --rebase origin main
          git push origin HEAD:main
