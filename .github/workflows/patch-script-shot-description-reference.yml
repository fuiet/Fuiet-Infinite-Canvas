name: Patch script shot description reference layout

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-script-shot-description-reference.py'
      - '.github/workflows/patch-script-shot-description-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reference-style shot description repair
        run: python scripts/patch-script-shot-description-reference.py
      - name: Syntax check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Focused regression test
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/script-shot-description-reference.test.mjs
      - name: Commit repair
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.local'
          git add \
            _read_123_zip_20260821_180410/app.js \
            _read_123_zip_20260821_180410/browser-bootstrap.js \
            _read_123_zip_20260821_180410/styles/script-shot-description-reference-v1.css \
            _read_123_zip_20260821_180410/tests/script-shot-description-reference.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify script shot descriptions with inline asset mentions'
          git push origin main
