name: Fix Blank Drop Exact QuickAdd

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blank-drop-exact-quickadd.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix exact function blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_read_123_zip_20260821_180410/app.js')
          s = path.read_text(encoding='utf-8')

          def block(src, name):
              start = src.index(f'  function {name}(')
              end = src.find('\n  function ', start + 3)
              if end < 0:
                  end = len(src)
              return start, end, src[start:end]

          # 1) Restore Command Palette: it must never reference fullMenu.
          a, b, cmd = block(s, 'showCommandPalette')
          bad = "const source=!fullMenu&&fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));let active=0,rows=[];"
          good = "const source=fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));let active=0,rows=[];"
          if bad in cmd:
              cmd = cmd.replace(bad, good, 1)
          if 'fullMenu' in cmd:
              raise SystemExit('showCommandPalette still references fullMenu')
          s = s[:a] + cmd + s[b:]

          # 2) QuickAdd: fullMenu only affects what UI is shown; fromNodeId is still
          # passed to runPaletteNode so a newly created node auto-connects to source.
          a, b, qa = block(s, 'showQuickAdd')
          expected_sig = "function showQuickAdd(x,y,p,fromNodeId=null,{preferAboveToolbar=false,fullMenu=false}={}){"
          if expected_sig not in qa:
              raise SystemExit('showQuickAdd signature mismatch')
          old = "const source=fromNodeId&&state.nodes.find(n=>n.id===fromNodeId),allowed=new Set(compatibleDownstreamTypes(source));"
          new = "const source=(!fullMenu&&fromNodeId)?state.nodes.find(n=>n.id===fromNodeId):null,allowed=new Set(compatibleDownstreamTypes(source));"
          if old in qa:
              qa = qa.replace(old, new, 1)
          elif new not in qa:
              raise SystemExit('showQuickAdd source line not found')
          if new not in qa:
              raise SystemExit('showQuickAdd fullMenu behavior missing')
          if "runPaletteNode(item.type,p,fromNodeId)" not in qa:
              raise SystemExit('auto-connect source was lost')
          s = s[:a] + qa + s[b:]

          # 3) Blank release must keep the stable cleanup and open the SAME add-node UI.
          a, b, finish = block(s, 'finishConnectionPointerUp')
          required = [
              'cleanupConnectionDrag(false);',
              'showQuickAdd(clientX,clientY,dropPoint,from,{fullMenu:true})'
          ]
          for token in required:
              if token not in finish:
                  raise SystemExit(f'missing blank-drop invariant: {token}')
          if 'showCommandPalette(' in finish:
              raise SystemExit('blank drop must not use Command Palette')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript and exact invariants
        run: |
          node --check _read_123_zip_20260821_180410/app.js
          python - <<'PY'
          from pathlib import Path
          s = Path('_read_123_zip_20260821_180410/app.js').read_text(encoding='utf-8')
          def block(src, name):
              start = src.index(f'  function {name}(')
              end = src.find('\n  function ', start + 3)
              if end < 0: end = len(src)
              return src[start:end]
          cmd = block(s, 'showCommandPalette')
          qa = block(s, 'showQuickAdd')
          finish = block(s, 'finishConnectionPointerUp')
          assert 'fullMenu' not in cmd
          assert "const source=(!fullMenu&&fromNodeId)?state.nodes.find(n=>n.id===fromNodeId):null" in qa
          assert "runPaletteNode(item.type,p,fromNodeId)" in qa
          assert "cleanupConnectionDrag(false);" in finish
          assert "showQuickAdd(clientX,clientY,dropPoint,from,{fullMenu:true})" in finish
          assert 'showCommandPalette(' not in finish
          PY
          git diff --check

      - name: Commit production fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/app.js
          git commit -m "Fix blank-drop add-node UI without connection regression"
          git push origin main
