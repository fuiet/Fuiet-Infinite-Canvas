name: Fix Provider Model Visibility V1

on:
  push:
    branches:
      - fix/provider-model-visibility
    paths:
      - '.github/workflows/fix-provider-model-visibility-v1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply provider model visibility fix
        run: python .github/scripts/fix_provider_model_visibility.py
      - name: Validate provider/model runtime
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-provider-model-visibility-v1.yml
          rm -f .github/scripts/fix_provider_model_visibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+fuiet@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix provider models missing from canvas nodes"
          git pull --rebase origin fix/provider-model-visibility
          git push origin HEAD:fix/provider-model-visibility
