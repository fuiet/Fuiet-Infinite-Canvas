name: Patch server media result preflight v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-server-media-result-preflight-v1.py'
      - '.github/workflows/patch-server-media-result-preflight-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply server result persistence and preflight patch
        run: python scripts/patch-server-media-result-preflight-v1.py
      - name: Syntax check server
        run: node --check _read_123_zip_20260821_180410/server.js
      - name: Syntax check regression test
        run: node --check _read_123_zip_20260821_180410/tests/server-media-result-preflight-v1.test.mjs
      - name: Run server media focused regression
        run: node --test _read_123_zip_20260821_180410/tests/server-media-result-preflight-v1.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit patched server
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            _read_123_zip_20260821_180410/server.js \
            _read_123_zip_20260821_180410/tests/server-media-result-preflight-v1.test.mjs
          git commit -m 'Harden server media result persistence and preflight'
          git push
