name: Fix Node Model Visibility V1

on:
  push:
    branches:
      - fix-node-model-visibility
    paths:
      - .github/scripts/fix_node_model_visibility.py
      - .github/workflows/fix-node-model-visibility-v1.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-node-model-visibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair
        run: python .github/scripts/fix_node_model_visibility.py
      - name: Syntax checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check browser-runtime.js
          node --check browser-bootstrap.js
          node --check app.js
          node --check provider-adapter-contract.js
      - name: Full checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/browser-bootstrap.js \
                  _read_123_zip_20260821_180410/app.js \
                  _read_123_zip_20260821_180410/tests/browser-storage-manager.test.mjs \
                  _read_123_zip_20260821_180410/tests/node-model-availability-runtime.test.mjs
          git diff --cached --check
          git commit -m "Make configured provider models visible to canvas nodes"
          git push origin HEAD:fix-node-model-visibility
