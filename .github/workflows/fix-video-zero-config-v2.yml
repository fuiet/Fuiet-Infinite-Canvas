name: Fix Video Zero Config V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-video-zero-config-v2.yml'
      - '_read_123_zip_20260821_180410/scripts/fix-video-zero-config-v2.py'
      - '_read_123_zip_20260821_180410/scripts/fix-video-zero-config-v2b.py'
      - '_read_123_zip_20260821_180410/tests/provider-adapter-v2.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-video:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply video zero-config runtime patch
        working-directory: _read_123_zip_20260821_180410
        run: python scripts/fix-video-zero-config-v2b.py
      - name: Validate syntax
        working-directory: _read_123_zip_20260821_180410
        run: |
          node --check provider-adapter-contract.js
          node --check server.js
          node --check dist/server/secure-index.js
      - name: Run video zero-config regression
        working-directory: _read_123_zip_20260821_180410
        run: node --test tests/video-zero-config-v2.test.mjs
      - name: Run full checks
        working-directory: _read_123_zip_20260821_180410
        run: |
          npm run check
          npm test
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit video runtime fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/provider-adapter-contract.js \
                  _read_123_zip_20260821_180410/server.js \
                  _read_123_zip_20260821_180410/dist/server/secure-index.js \
                  _read_123_zip_20260821_180410/tests/video-zero-config-v2.test.mjs
          git commit -m 'Fix current video zero-config runtime contract'
          git push origin HEAD:main
