name: Fix Persistent Manual Text Mode

on:
  push:
    branches:
      - security/video-worker-hardening-20260825
    paths:
      - '.github/workflows/fix-text-manual-mode-v25.yml'
      - '_read_123_zip_20260821_180410/scripts/fix-text-manual-mode-v25.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/video-worker-hardening-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply persistent manual text mode fix
        working-directory: _read_123_zip_20260821_180410
        run: |
          python scripts/fix-text-manual-mode-v25.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          app = path.read_text(encoding='utf-8')
          old = "    if(n.textInputMode!=='manual')snapshot('切换手动文本模式');\n"
          if old in app:
              app = app.replace(old, '', 1)
          if "snapshot('切换手动文本模式')" in app:
              raise SystemExit('manual mode can still be reverted through undo history')
          path.write_text(app, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        working-directory: _read_123_zip_20260821_180410
        run: node --check app.js
      - name: Validate app checks
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Validate existing tests
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Validate text node contract
        working-directory: _read_123_zip_20260821_180410
        run: node tests/text-node-v23.test.mjs
      - name: Verify diff
        run: |
          git status --short
          git diff --check
      - name: Commit persistent manual mode fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _read_123_zip_20260821_180410/app.js
          git commit -m 'Lock manual text node mode'
          git push origin HEAD:security/video-worker-hardening-20260825
