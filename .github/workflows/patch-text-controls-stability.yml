name: Patch text controls stability

on:
  push:
    paths:
      - 'scripts/patch-text-controls-stability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stability patch
        run: python scripts/patch-text-controls-stability.py
      - name: Check
        working-directory: _read_123_zip_20260821_180410
        run: npm run check
      - name: Test
        working-directory: _read_123_zip_20260821_180410
        run: npm test
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _read_123_zip_20260821_180410/ui-v2.js _read_123_zip_20260821_180410/browser-bootstrap.js _read_123_zip_20260821_180410/tests/text-generator-ui-v2-stability.test.mjs
          git commit -m "Stabilize text generator controls"
          git push
